<div class="alarms-page">
  <div class="layui-card"><div class="layui-card-header">紧急报警</div><div class="layui-card-body">
    <div class="layui-tab"><ul class="layui-tab-title"><li class="layui-this">报警事件</li><li>推送对象</li></ul><div class="layui-tab-content">
      <div class="layui-tab-item layui-show"><div class="alarm-toolbar"><div><select id="alarm-status" class="layui-select"><option value="">全部状态</option><option value="active">待处理</option><option value="acknowledged">已确认</option><option value="resolved">已解除</option></select><button id="alarm-refresh" class="layui-btn layui-btn-primary">刷新</button></div><button id="alarm-create" class="layui-btn layui-btn-danger">发起紧急报警</button></div><table class="layui-hide" id="alarm-table"></table></div>
      <div class="layui-tab-item"><div class="alarm-toolbar"><span>报警推送会记录到指定平台用户或受控终端 IP</span><button id="alarm-add-recipient" class="layui-btn">添加推送对象</button></div><table class="layui-hide" id="alarm-recipient-table"></table></div>
    </div></div>
  </div></div>
</div>
<style>.alarms-page{padding:16px}.alarm-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;color:#667085}.alarm-toolbar .layui-select{display:inline-block;width:150px;margin-right:8px}.alarm-toolbar .layui-btn{margin:0}</style>
<script type="text/html" id="alarm-actions">{{# if(d.status==='active'){ }}<a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="ack">确认</a>{{# } }}{{# if(d.status!=='resolved'){ }}<a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="resolve">解除</a>{{# } }}<a class="layui-btn layui-btn-xs" lay-event="linkages">联动</a><a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="retry">重试</a></script>
<script type="text/html" id="recipient-actions"><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a></script>
<script>
layui.use(['table','layer','form','jquery'],function(){
  const table=layui.table,layer=layui.layer,form=layui.form,$=layui.jquery;
  const labels={active:'待处理',acknowledged:'已确认',resolved:'已解除',info:'提示',warning:'警告',urgent:'紧急',critical:'严重'};
  let rooms=[],devices=[];
  function esc(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
  function api(url,method,data,done){$.ajax({url,type:method,contentType:data===undefined?undefined:'application/json',data:data===undefined?undefined:JSON.stringify(data),success:res=>res.code===0?done(res):layer.msg(res.msg||'操作失败'),error:xhr=>layer.msg((xhr.responseJSON||{}).msg||'请求失败')});}
  function loadTargets(){api('/api/resources/rooms','GET',undefined,res=>rooms=res.data||[]);api('/api/devices','GET',undefined,res=>devices=(res.data||[]).filter(item=>item.enabled));}
  function renderAlarms(){api('/api/alarms?status='+encodeURIComponent($('#alarm-status').val()),'GET',undefined,res=>table.render({elem:'#alarm-table',data:res.data||[],cols:[[{field:'occurred_at',title:'报警时间',minWidth:165},{field:'severity',title:'级别',width:90,templet:item=>labels[item.severity]||item.severity},{field:'source_type',title:'来源',width:110},{field:'room_name',title:'房间',width:130,templet:item=>item.room_name||'-'},{field:'device_name',title:'设备',minWidth:140,templet:item=>item.device_name||'-'},{field:'message',title:'报警内容',minWidth:210},{field:'status',title:'状态',width:90,templet:item=>labels[item.status]||item.status},{field:'acknowledged_by',title:'确认人',width:100,templet:item=>item.acknowledged_by||'-'},{title:'操作',toolbar:'#alarm-actions',width:235}]],page:true,limit:20}));}
  function renderRecipients(){api('/api/alarm-recipients','GET',undefined,res=>table.render({elem:'#alarm-recipient-table',data:res.data||[],cols:[[{field:'username',title:'平台用户',minWidth:150,templet:item=>item.username||'-'},{field:'target_ip',title:'终端 IP',minWidth:160,templet:item=>item.target_ip||'-'},{field:'enabled',title:'状态',width:100,templet:item=>item.enabled?'启用':'停用'},{field:'updated_at',title:'更新时间',minWidth:165},{title:'操作',toolbar:'#recipient-actions',width:90}]],page:true,limit:20}));}
  function openAlarm(){const roomOptions=rooms.filter(item=>item.enabled).map(item=>'<option value="'+item.id+'">'+esc((item.area_name?item.area_name+' / ':'')+item.name)+'</option>').join('');const deviceOptions=devices.map(item=>'<option value="'+esc(item.device_id)+'">'+esc(item.name)+' / '+esc(item.device_id)+'</option>').join('');layer.open({type:1,title:'发起紧急报警',area:['560px','auto'],content:'<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">报警级别</label><div class="layui-input-block"><select name="severity"><option value="urgent">紧急</option><option value="critical">严重</option><option value="warning">警告</option></select></div></div><div class="layui-form-item"><label class="layui-form-label">谈话房间</label><div class="layui-input-block"><select name="room_id"><option value="">不关联房间</option>'+roomOptions+'</select></div></div><div class="layui-form-item"><label class="layui-form-label">来源设备</label><div class="layui-input-block"><select name="device_id"><option value="">按房间设备联动</option>'+deviceOptions+'</select></div></div><div class="layui-form-item"><label class="layui-form-label">报警内容</label><div class="layui-input-block"><textarea class="layui-textarea" name="message" required></textarea></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn layui-btn-danger" lay-submit lay-filter="alarm-create-submit">发起报警并执行联动</button></div></div></form>',success:()=>form.render()});}
  function openRecipient(){layer.open({type:1,title:'添加推送对象',area:['520px','auto'],content:'<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">平台用户</label><div class="layui-input-block"><input class="layui-input" name="username" placeholder="填写现有用户名，可留空"></div></div><div class="layui-form-item"><label class="layui-form-label">终端 IP</label><div class="layui-input-block"><input class="layui-input" name="target_ip" placeholder="例如：192.168.1.20，可留空"></div></div><div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="enabled" lay-skin="switch" checked></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="alarm-recipient-submit">保存</button></div></div></form>',success:()=>form.render()});}
  function showLinkages(alarm){api('/api/alarms/'+alarm.id+'/linkages','GET',undefined,res=>{const rows=(res.data||[]).map(item=>'<tr><td>'+esc(item.action_type)+'</td><td>'+esc(item.status)+'</td><td>'+esc(item.detail_json||'-')+'</td><td>'+esc(item.completed_at||'-')+'</td></tr>').join('');layer.open({type:1,title:'报警联动任务',area:['820px','auto'],content:'<table class="layui-table" style="margin:16px;width:calc(100% - 32px)"><thead><tr><th>动作</th><th>状态</th><th>执行详情</th><th>完成时间</th></tr></thead><tbody>'+rows+'</tbody></table>'});});}
  form.on('submit(alarm-create-submit)',data=>{api('/api/alarms','POST',{source_type:'manual',severity:data.field.severity,message:data.field.message,room_id:data.field.room_id,device_id:data.field.device_id},()=>{layer.closeAll();renderAlarms();layer.msg('报警已创建，联动任务正在执行');});return false;});
  form.on('submit(alarm-recipient-submit)',data=>{api('/api/alarm-recipients','POST',{username:data.field.username,target_ip:data.field.target_ip,enabled:!!data.field.enabled},()=>{layer.closeAll();renderRecipients();layer.msg('推送对象已保存');});return false;});
  table.on('tool(alarm-table)',obj=>{if(obj.event==='ack')api('/api/alarms/'+obj.data.id+'/status','POST',{status:'acknowledged'},()=>{renderAlarms();layer.msg('报警已确认');});if(obj.event==='resolve')api('/api/alarms/'+obj.data.id+'/status','POST',{status:'resolved'},()=>{renderAlarms();layer.msg('报警已解除');});if(obj.event==='linkages')showLinkages(obj.data);if(obj.event==='retry')api('/api/alarms/'+obj.data.id+'/linkages/execute','POST',{},()=>{layer.msg('联动已重新排队');setTimeout(()=>showLinkages(obj.data),500);});});
  table.on('tool(alarm-recipient-table)',obj=>{if(obj.event==='delete')layer.confirm('删除该推送对象？',()=>api('/api/alarm-recipients/'+obj.data.id,'DELETE',undefined,()=>{renderRecipients();layer.msg('已删除');}));});
  $('#alarm-refresh').on('click',renderAlarms);$('#alarm-create').on('click',openAlarm);$('#alarm-add-recipient').on('click',openRecipient);loadTargets();renderAlarms();renderRecipients();
});
</script>
