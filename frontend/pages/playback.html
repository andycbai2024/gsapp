<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    .playback-page { max-width: 1560px; margin: 0 auto; padding: 18px 22px 28px; }
    .playback-filter-panel { padding: 18px 20px 4px; margin-bottom: 14px; }
    .playback-filter-title { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; color: #1f2d3d; font-size: 16px; font-weight: 600; }
    .playback-filter-title .layui-icon { color: #16baaa; font-size: 20px; }
    .playback-filter-form { display: flex; flex-wrap: wrap; align-items: end; gap: 0 14px; }
    .playback-filter-form .layui-form-item { margin-bottom: 14px; }
    .playback-filter-form .layui-form-label { width: auto; padding-left: 0; padding-right: 8px; color: #5b6573; }
    .playback-filter-form .layui-input-inline { margin-right: 0; }
    .playback-filter-actions { display: flex; gap: 8px; padding-bottom: 14px; }
    .playback-list-panel { padding: 0 14px 6px; }
    .playback-list-header, .playback-workspace-header { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 4px; border-bottom: 1px solid #edf0f2; }
    .playback-list-title, .playback-workspace-title { color: #1f2d3d; font-weight: 600; }
    .playback-list-caption { color: #8a94a3; font-size: 13px; }
    #ID_playback_workspace { display: none; margin-top: 14px; overflow: hidden; }
    .playback-layout { display: grid; grid-template-columns: minmax(0, 1fr) 272px; gap: 0; }
    .playback-stage { background: #202a33; padding: 16px; }
    .playback-meta { display: flex; align-items: center; min-height: 32px; color: #d9e1e8; margin-bottom: 12px; font-size: 13px; }
    #ID_player { display: block; width: 100%; aspect-ratio: 16 / 9; background: #050708; }
    .playback-side { padding: 18px 16px; background: #fafbfc; border-left: 1px solid #edf0f2; }
    .playback-side-title { margin: 0 0 18px; color: #475467; font-size: 14px; font-weight: 600; }
    .playback-side .layui-form-label { width: 100%; padding: 0 0 8px; text-align: left; color: #667085; }
    .playback-side .layui-input-block { margin-left: 0; }
    .playback-side .layui-form-item { margin-bottom: 16px; }

    .timeline-container {
      position: relative;
      height: 80px;
      margin: 30px 0;
      user-select: none;
    }

    .timeline-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      height: 6px;
      background: #52606b;
      border-radius: 3px;
      overflow: hidden;
    }

    .timeline-segments {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      height: 6px;
    }

    .segment {
      position: absolute;
      height: 100%;
      background: #16baaa;
      border-right: 1px solid rgba(255, 255, 255, 0.5);
    }

    .segment:hover {
      background: #0fa391;
    }

    .timeline-labels {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      font-size: 12px;
      color: #c6d1db;
      white-space: nowrap;
      overflow: visible;
    }

    .label {
      position: absolute;
      transform: translateX(-50%);
    }

    .playhead {
      position: absolute;
      top: 20px;
      width: 2px;
      height: 40px;
      background: #ff5722;
      z-index: 10;
      transform: translateX(-50%);
      cursor: grab;
    }

    .playhead::after {
      content: "▶";
      position: absolute;
      top: -10px;
      left: -6px;
      font-size: 16px;
      color: #ff5722;
    }

    .playhead.dragging {
      cursor: grabbing;
    }

    .current-time {
      position: absolute;
      top: 0px;
      left: 0;
      font-size: 12px;
      color: #344054;
      padding: 2px 5px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #ddd;
      border-radius: 3px;
    }
    @media (max-width: 900px) {
      .playback-page { padding: 12px; }
      .playback-layout { grid-template-columns: 1fr; }
      .playback-side { border-left: 0; border-top: 1px solid #edf0f2; }
    }
  </style>
</head>

<body>
  <div style="padding:16px">
    <div class="layui-card">
      <div class="layui-card-header">本地录像管理</div>
      <div class="layui-card-body">
        <div class="layui-form" style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
          <input id="ID_record_device" class="layui-input" placeholder="设备名称" style="width:180px">
          <input id="ID_record_case" class="layui-input" placeholder="案件编号 / 案件名称" style="width:210px">
          <input id="ID_record_keyword" class="layui-input" placeholder="关键字 / 通道 / 流 ID" style="width:200px">
          <input id="ID_record_start" type="date" class="layui-input" style="width:160px">
          <input id="ID_record_end" type="date" class="layui-input" style="width:160px">
          <button type="button" class="layui-btn" style="background:#16baaa" id="ID_record_search">查询</button>
          <button type="button" class="layui-btn layui-btn-primary" id="ID_record_reset">重置</button>
        </div>
        <table class="layui-hide" id="ID_recorded_video_table"></table>
      </div>
    </div>
  </div>

  <!-- toolbar 模板 -->
  <script id="ID_tpl_toolbar" type="text/html">
      <a
        class="layui-btn layui-btn-xs"
        lay-event="play"
        style="background-color: #16baaa"
        >打开回放</a
      >
      <a
        class="layui-btn layui-btn-xs layui-btn-normal"
        lay-event="download"
        >下载 ZIP</a
      >
      <a
        class="layui-btn layui-btn-xs"
        lay-event="del"
        style="background-color: #ff5722"
        >删除</a
      >
    </script>

  <script id="ID_tpl_segment_toolbar" type="text/html">
    <a class="layui-btn layui-btn-xs" lay-event="download">下载</a>
  </script>

  <script id="ID_tpl_recorded_video_player" type="text/html">
    <div class="layui-form" style="padding:16px 20px 0">
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">录像日期</label>
          <div class="layui-input-inline"><select id="ID_video_date" lay-filter="video_date"></select></div>
        </div>
        <div class="layui-inline"><button type="button" class="layui-btn layui-btn-primary" id="ID_download_segment">下载当前片段</button></div>
        <div class="layui-inline"><button type="button" class="layui-btn" id="ID_download_selected">下载已选片段 ZIP</button></div>
      </div>
      <div style="display:flex;justify-content:center;background:#202a33;padding:12px">
        <video id="ID_player" controls autoplay playsinline style="width:min(100%,860px);aspect-ratio:16/9;background:#050708"></video>
      </div>
      <div class="timeline-container" id="timeline" style="margin:20px 32px">
        <div class="timeline-track"></div><div class="timeline-segments" id="segments"></div><div class="timeline-labels" id="labels"></div><div class="playhead" id="playhead"></div><div class="current-time" id="currentTime">--:--:--</div>
      </div>
      <table class="layui-hide" id="ID_recorded_segment_table"></table>
    </div>
  </script>

  <script>
    layui.use(function () {
      let layer = layui.layer;
      let table = layui.table;
      let $ = layui.jquery;
      let form = layui.form;

      function toPlaybackPath(path) {
        return `/api/playback/recordings/file?path=${encodeURIComponent(path)}`;
      }

      function toDownloadPath(path) {
        return `/api/playback/recordings/file?path=${encodeURIComponent(path)}&download=true`;
      }

      // 解析时间字符串为时间戳(ms)
      function parseTime(timeStr) {
        return new Date(timeStr).getTime();
      }

      // 格式化时间戳为 HH:mm:ss
      function formatTime(ts) {
        let d = new Date(ts);
        return d.toTimeString().substr(0, 8);
      }

      let playbackSessionId = 0;
      let currentPlayback = null;
      let playbackController = null;
      let recordingsCache = new Map();

      function safeDownloadName(value) {
        return String(value || "录像").replace(/[\\/:*?"<>|]/g, "_");
      }

      function downloadRecording(rec) {
        if (!rec || !rec.filename) return;
        const recordedAt = new Date(rec.start).toLocaleString("zh-CN", { hour12: false }).replace(/[/:\s]/g, "-");
        const link = document.createElement("a");
        link.href = toDownloadPath(rec.recording_path || rec.filename);
        link.download = `${safeDownloadName(`${rec.device_name}-${rec.channel_name}`)}_${recordedAt}.mp4`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      function renderSegmentTable(list) {
        table.render({
          elem: "#ID_recorded_segment_table",
          id: "ID_recorded_segment_table",
          data: Array.isArray(list) ? list : [],
          height: 250,
          page: false,
          cols: [[
            { type: "checkbox", fixed: "left" },
            { field: "device_name", title: "设备", minWidth: 130 },
            { field: "channel_name", title: "通道", minWidth: 120 },
            { field: "format", title: "格式", width: 80, align: "center" },
            { field: "case_labels", title: "关联案件", minWidth: 180 },
            { field: "start", title: "开始时间", minWidth: 170 },
            { field: "duration", title: "时长(秒)", width: 100, align: "center" },
            { field: "filename", title: "录像文件", minWidth: 240 },
            { title: "操作", toolbar: "#ID_tpl_segment_toolbar", width: 80, align: "center" }
          ]]
        });
      }

      async function downloadSelectedRecordings() {
        const selected = table.checkStatus("ID_recorded_segment_table").data || [];
        if (!selected.length) {
          layer.msg("请先勾选要下载的录像片段");
          return;
        }
        await downloadRecordingsZip(selected.map((item) => item.filename));
      }

      async function downloadRecordingsZip(paths) {
        if (!paths.length) {
          layer.msg("没有可下载的录像片段");
          return;
        }
        const loading = layer.load(2, { shade: [0.1, "#fff"] });
        try {
          const response = await fetch("/api/playback/recordings-download-zip", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paths })
          });
          if (!response.ok || (response.headers.get("content-type") || "").includes("application/json")) {
            const body = await response.json();
            throw new Error(body.msg || "录像打包失败");
          }
          const blob = await response.blob();
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "录像片段.zip";
          document.body.appendChild(link);
          link.click();
          URL.revokeObjectURL(link.href);
          document.body.removeChild(link);
        } catch (error) {
          layer.msg(error.message || "录像打包失败");
        } finally {
          layer.close(loading);
        }
      }

      async function downloadStreamRecordings(record) {
        const dates = Array.isArray(record.dates) ? record.dates : [];
        if (!dates.length) {
          layer.msg("该录像没有可下载的片段");
          return;
        }
        const loading = layer.load(2, { shade: [0.1, "#fff"] });
        try {
          const caseKeyword = $("#ID_record_case").val().trim();
          const filesByDate = await Promise.all(dates.map(async (date) => {
            const params = new URLSearchParams({ app: record.app, stream: record.stream, date });
            if (caseKeyword) params.set("case_keyword", caseKeyword);
            const response = await fetch(`/api/playback/streamid-record?${params.toString()}`);
            const body = await response.json();
            if (!response.ok || body.code !== 0) throw new Error(body.msg || "获取录像片段失败");
            return Array.isArray(body.data) ? body.data.map((item) => item.filename) : [];
          }));
          const paths = [...new Set(filesByDate.flat())];
          layer.close(loading);
          if (paths.length > 50) {
            layer.msg(`共 ${paths.length} 个片段，单次最多可打包 50 个`);
            return;
          }
          await downloadRecordingsZip(paths);
        } catch (error) {
          layer.close(loading);
          layer.msg(error.message || "获取录像片段失败");
        }
      }

      function createPlaybackController() {
        const videoPlayer = document.getElementById("ID_player");
        const timeline = document.getElementById("timeline");
        const segmentsContainer = document.getElementById("segments");
        const labelsContainer = document.getElementById("labels");
        const playhead = document.getElementById("playhead");
        const currentTimeEl = document.getElementById("currentTime");
        const downloadBtn = document.getElementById("ID_download_segment");

        let recordings = [];
        let startTime = 0;
        let endTime = 0;
        let durationMs = 1;
        let isDragging = false;
        let isDestroyed = false;
        let rafSeekId = 0;
        let pendingSeekTs = null;

        function getRecStart(rec) {
          return parseTime(rec.start);
        }

        function getRecEnd(rec) {
          if (typeof rec.__actualDurationMs === "number" && rec.__actualDurationMs > 0) {
            return getRecStart(rec) + rec.__actualDurationMs;
          }
          return parseTime(rec.end);
        }

        function recalcRange() {
          if (!recordings.length) {
            startTime = 0;
            endTime = 0;
            durationMs = 1;
            return;
          }
          startTime = getRecStart(recordings[0]);
          endTime = recordings.reduce((maxTs, rec) => Math.max(maxTs, getRecEnd(rec)), startTime);
          durationMs = Math.max(1, endTime - startTime);
        }

        const onMouseMove = (e) => {
          if (!isDragging || !timeline) return;
          const rect = timeline.getBoundingClientRect();
          let x = e.clientX - rect.left;
          if (x < 0) x = 0;
          if (x > rect.width) x = rect.width;
          const timeTs = startTime + (x / rect.width) * durationMs;
          seekTo(timeTs);
        };

        const onMouseUp = () => {
          if (!isDragging) return;
          isDragging = false;
          playhead?.classList.remove("dragging");
        };

        const onPlayheadDown = (e) => {
          isDragging = true;
          playhead?.classList.add("dragging");
          e.preventDefault();
        };

        const onTimelineClick = (e) => {
          if (!timeline) return;
          const rect = timeline.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const timeTs = startTime + (x / rect.width) * durationMs;
          seekTo(timeTs);
        };

        const onEnded = () => {
          if (!videoPlayer || recordings.length === 0) return;
          const src = videoPlayer.src || "";
          const currentIndex = recordings.findIndex((rec) =>
            src.endsWith(rec.filename)
          );
          if (currentIndex !== -1 && currentIndex + 1 < recordings.length) {
            const nextRecording = recordings[currentIndex + 1];
            const nextStart = parseTime(nextRecording.start);
            seekTo(nextStart + 1000);
          }
        };

        const onLoadedMetadata = () => {
          if (!videoPlayer) return;
          const rec = getRecordingFromCurrentSrc();
          if (!rec) return;

          const d = Number(videoPlayer.duration);
          if (!Number.isFinite(d) || d <= 0) return;
          const actualMs = Math.max(1000, Math.round(d * 1000));
          const declaredMs = Math.max(1000, parseTime(rec.end) - parseTime(rec.start));

          // 后端可能按默认 300s 估算末段时长，这里用真实文件时长纠正时间轴
          if (Math.abs(actualMs - declaredMs) > 1500) {
            rec.__actualDurationMs = actualMs;
            rec.end = new Date(parseTime(rec.start) + actualMs).toISOString();
            recalcRange();
            renderTimeline();
            updatePlayhead(parseTime(rec.start) + videoPlayer.currentTime * 1000);
          }
        };

        function getRecordingFromCurrentSrc() {
          if (!videoPlayer || !videoPlayer.src || recordings.length === 0) {
            return null;
          }

          let filename = null;
          try {
            const url = new URL(videoPlayer.src, window.location.href);
            filename = url.pathname + url.search;
          } catch (e) {
            return null;
          }

          const rec = recordings.find((r) => r.filename === filename);
          return rec || null;
        }

        const onTimeUpdate = () => {
          if (isDragging) return;
          if (!videoPlayer || recordings.length === 0) return;
          if (!videoPlayer.src) return;

          const rec = getRecordingFromCurrentSrc();
          if (!rec) return;

          const maxLocal = Math.max(0, getRecEnd(rec) - parseTime(rec.start));
          const videoLocalTime = Math.min(videoPlayer.currentTime * 1000, maxLocal);
          const videoStartTime = parseTime(rec.start);
          const absoluteTime = videoStartTime + videoLocalTime;

          updatePlayhead(absoluteTime);
        };

        const onDownloadClick = () => {
          const rec = getRecordingFromCurrentSrc();
          if (!rec) {
            if (layer && typeof layer.msg === "function") {
              layer.msg("⚠️ 当前没有可下载的片段", {
                time: 1500,
                offset: "t",
                shift: 1,
              });
            }
            return;
          }

          downloadRecording(rec);
        };

        function clearTimeline() {
          if (segmentsContainer) segmentsContainer.innerHTML = "";
          if (labelsContainer) labelsContainer.innerHTML = "";
          if (playhead) playhead.style.left = "0px";
          if (currentTimeEl) {
            currentTimeEl.style.left = "0px";
            currentTimeEl.textContent = "--:--:--";
          }
        }

        function renderTimeline() {
          if (!timeline || !segmentsContainer || !labelsContainer) return;
          segmentsContainer.innerHTML = "";
          labelsContainer.innerHTML = "";

          const pxPerMs = timeline.offsetWidth / durationMs;
          const frag = document.createDocumentFragment();

          recordings.forEach((rec) => {
            const s = parseTime(rec.start);
            const e = parseTime(rec.end);
            const width = (e - s) * pxPerMs;
            const left = (s - startTime) * pxPerMs;
            const seg = document.createElement("div");
            seg.className = "segment";
            seg.style.left = `${left}px`;
            seg.style.width = `${width}px`;
            frag.appendChild(seg);
          });
          segmentsContainer.appendChild(frag);

          const current = new Date(startTime);
          current.setMinutes(0, 0, 0);
          let t = current.getTime();
          const labelsFrag = document.createDocumentFragment();
          while (t <= endTime) {
            const left = (t - startTime) * pxPerMs;
            if (left >= 0 && left <= timeline.offsetWidth) {
              const label = document.createElement("div");
              label.className = "label";
              label.style.left = `${left}px`;
              const d = new Date(t);
              const h = String(d.getHours()).padStart(2, "0");
              const m = String(d.getMinutes()).padStart(2, "0");
              label.textContent = `${h}:${m}:00`;
              labelsFrag.appendChild(label);
            }
            t += 60 * 60 * 1000;
          }
          labelsContainer.appendChild(labelsFrag);
        }

        function updatePlayhead(timeTs) {
          if (!timeline || !playhead || !currentTimeEl) return;
          const pxPerMs = timeline.offsetWidth / durationMs;
          const left = (timeTs - startTime) * pxPerMs;
          playhead.style.left = `${left}px`;
          currentTimeEl.style.left = `${left + 10}px`;
          currentTimeEl.textContent = formatTime(timeTs);
        }

        function seekTo(timeTs) {
          if (!timeline || !videoPlayer || recordings.length === 0) return;
          if (pendingSeekTs === null) pendingSeekTs = timeTs;
          else pendingSeekTs = timeTs;

          if (rafSeekId) return;
          rafSeekId = requestAnimationFrame(() => {
            rafSeekId = 0;
            if (pendingSeekTs === null || isDestroyed) return;
            const ts = pendingSeekTs;
            pendingSeekTs = null;

            let rec = recordings.find(
              (r) => ts >= getRecStart(r) && ts < getRecEnd(r)
            );
            let targetTs = ts;
            if (!rec) {
              const nextRec = recordings.find((r) => getRecStart(r) > ts);
              if (nextRec) {
                rec = nextRec;
                targetTs = getRecStart(rec) + 1000;
              } else {
                rec = recordings[recordings.length - 1];
                targetTs = Math.max(getRecStart(rec), getRecEnd(rec) - 1000);
              }
            }
            const videoStart = getRecStart(rec);
            const recDurationMs = Math.max(1000, getRecEnd(rec) - videoStart);
            targetTs = Math.min(targetTs, videoStart + recDurationMs - 50);
            updatePlayhead(targetTs);
            const seekTimeInVideo = Math.max(0, (targetTs - videoStart) / 1000);

            const currentSrc = videoPlayer.src || "";
            const isSameFile = currentSrc.endsWith(rec.filename);

            if (isSameFile) {
              const browserDuration = Number(videoPlayer.duration);
              const maxSeek = Number.isFinite(browserDuration) && browserDuration > 0
                ? Math.max(0, browserDuration - 0.05)
                : seekTimeInVideo;
              videoPlayer.currentTime = Math.min(seekTimeInVideo, maxSeek);
              return;
            }

            videoPlayer.onloadedmetadata = function () {
              const browserDuration = Number(videoPlayer.duration);
              const maxSeek = Number.isFinite(browserDuration) && browserDuration > 0
                ? Math.max(0, browserDuration - 0.05)
                : seekTimeInVideo;
              videoPlayer.currentTime = Math.min(seekTimeInVideo, maxSeek);
              const p = videoPlayer.play();
              if (p && typeof p.catch === "function") p.catch(() => { });
              videoPlayer.onloadedmetadata = null;
            };
            videoPlayer.src = rec.filename;
            videoPlayer.load();
          });
        }

        function cleanup() {
          isDestroyed = true;
          if (rafSeekId) cancelAnimationFrame(rafSeekId);
          rafSeekId = 0;
          pendingSeekTs = null;

          playhead?.removeEventListener("mousedown", onPlayheadDown);
          timeline?.removeEventListener("click", onTimelineClick);
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);

          videoPlayer?.removeEventListener("ended", onEnded);
          videoPlayer?.removeEventListener("timeupdate", onTimeUpdate);
          videoPlayer?.removeEventListener("loadedmetadata", onLoadedMetadata);

          downloadBtn?.removeEventListener("click", onDownloadClick);

          if (videoPlayer) {
            videoPlayer.pause();
            videoPlayer.removeAttribute("src");
            videoPlayer.load();
          }
          clearTimeline();
        }

        playhead?.addEventListener("mousedown", onPlayheadDown);
        timeline?.addEventListener("click", onTimelineClick);
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);

        videoPlayer?.addEventListener("ended", onEnded);
        videoPlayer?.addEventListener("timeupdate", onTimeUpdate);
        videoPlayer?.addEventListener("loadedmetadata", onLoadedMetadata);

        if (downloadBtn) {
          downloadBtn.addEventListener("click", onDownloadClick);
        }

        clearTimeline();

        return {
          setRecordings: function (list) {
            recordings = Array.isArray(list) ? list : [];
            recordings = recordings
              .slice()
              .sort((a, b) => parseTime(a.start) - parseTime(b.start));

            if (recordings.length === 0) {
              clearTimeline();
              if (currentTimeEl) currentTimeEl.textContent = "无录像";
              return;
            }

            recalcRange();

            renderTimeline();
            updatePlayhead(startTime);
            seekTo(startTime);
          },
          cleanup,
        };
      }

      function loadRecordings(app, stream, date) {
        if (!currentPlayback || currentPlayback.app !== app || currentPlayback.stream !== stream) {
          return;
        }
        const key = `${app}||${stream}||${date}||${currentPlayback.caseKeyword || ""}`;

        const useData = (list) => {
          renderSegmentTable(list);
          const recordings = (Array.isArray(list) ? list : []).map((rec) => ({
            ...rec,
            recording_path: rec.filename,
            filename: toPlaybackPath(rec.filename),
          }));
          playbackController?.setRecordings(recordings);
        };

        if (recordingsCache.has(key)) {
          useData(recordingsCache.get(key));
          return;
        }

        let loading = layer.load(2, { shade: [0.1, "#fff"] });
        $.ajax({
          url: `/api/playback/streamid-record?app=${encodeURIComponent(
            app
          )}&stream=${encodeURIComponent(stream)}&date=${encodeURIComponent(date)}&case_keyword=${encodeURIComponent(currentPlayback.caseKeyword || "")}`,
          type: "GET",
          dataType: "json",
          timeout: 10000,
          success: function (res) {
            if (!res || res.code !== 0) {
              layer.msg("⚠️ 获取录像失败", {
                time: 1500,
                offset: "t",
                shift: 1,
              });
              useData([]);
              return;
            }
            const list = Array.isArray(res.data) ? res.data : [];
            recordingsCache.set(key, list);
            useData(list);
          },
          error: function () {
            layer.msg("⚠️ 获取录像失败", {
              time: 1500,
              offset: "t",
              shift: 1,
            });
            useData([]);
          },
          complete: function () {
            layer.close(loading);
          },
        });
      }

      // 表格渲染
      function renderTable() {
        let loading = layer.load(2, { shade: [0.1, "#fff"] });
        const params = new URLSearchParams();
        const deviceName = $("#ID_record_device").val().trim();
        const caseKeyword = $("#ID_record_case").val().trim();
        const keyword = $("#ID_record_keyword").val().trim();
        const dateStart = $("#ID_record_start").val();
        const dateEnd = $("#ID_record_end").val();
        if (deviceName) params.set("device_name", deviceName);
        if (caseKeyword) params.set("case_keyword", caseKeyword);
        if (keyword) params.set("keyword", keyword);
        if (dateStart) params.set("date_start", dateStart);
        if (dateEnd) params.set("date_end", dateEnd);
        $.ajax({
          url: `/api/playback/streamid-record-list?${params.toString()}`,
          type: "GET",
          dataType: "json",
          timeout: 10000,
          success: function (res) {
            if (res.code === 0) {
              let data = res.data || [];
              table.render({
                elem: "#ID_recorded_video_table",
                data: data,
                cols: [
                  [
                    {
                      field: "id",
                      title: "序号",
                      align: "center",
                      width: 80,
                      templet: function (d) {
                        return d.LAY_NUM;
                      },
                    },
                    {
                      field: "device_name",
                      title: "设备名称",
                      align: "center",
                      minWidth: 150,
                    },
                    {
                      field: "recording_name",
                      title: "录像名称",
                      align: "center",
                      minWidth: 220,
                    },
                    {
                      field: "channel_name",
                      title: "通道名称",
                      align: "center",
                      minWidth: 130,
                    },
                    {
                      field: "case_labels",
                      title: "关联案件",
                      align: "center",
                      minWidth: 220,
                    },
                    {
                      field: "isRecordingMP4",
                      title: "录像状态",
                      align: "center",
                      width: 120,
                      templet: function (d) {
                        if (d.isRecordingMP4) {
                          return `<span style="color:#16baaa;font-weight:600;">录像中</span>`;
                        }
                        const hasPolicy = d.record_days !== undefined && d.record_days !== null && String(d.record_days).trim() !== "-" && String(d.record_days).trim() !== "";
                        if (hasPolicy && !d.isOnline) {
                          return `<span style="color:#ffb800;font-weight:600;">计划录像（离线）</span>`;
                        }
                        return `<span style="color:#999;">未录像</span>`;
                      },
                    },
                    {
                      field: "record_days",
                      title: "保留(天)",
                      align: "center",
                      width: 100,
                    },
                    {
                      field: "app",
                      title: "应用名",
                      align: "center",
                      width: 150,
                    },
                    {
                      field: "stream",
                      title: "流ID",
                      align: "center",
                      width: 200,
                    },
                    // {
                    //   field: "isOnline",
                    //   title: "源流接入",
                    //   align: "center",
                    //   width: 120,
                    //   templet: function (d) {
                    //     if (d.isOnline) {
                    //       return `<span style="color:#16baaa;font-weight:600;">已接入</span>`;
                    //     }
                    //     return `<span style="color:#999;">已离线</span>`;
                    //   },
                    // },
                    {
                      field: "slice_num",
                      title: "视频片段数",
                      align: "center",
                      width: 150,
                    },
                    {
                      field: "total_storage_gb",
                      title: "总存储容量",
                      align: "center",
                      width: 150,
                      templet: function (d) {
                        return `<div>${d.total_storage_gb} GB</div>`;
                      },
                    },

                    {
                      field: "operate",
                      title: "操作",
                      width: 200, // 调整宽度以容纳两个按钮
                      align: "center",
                      toolbar: "#ID_tpl_toolbar", // 推荐使用模板（更清晰）
                    },
                  ],
                ],
                page: true,
                limits: [8, 16, 32],
                limit: 8,
              });
            }
          },
          error: function () {
            layer.msg("❌ 录像列表请求失败", {
              time: 1500,
              offset: "t",
              shift: 1,
            });
          },
          complete: function () {
            layer.close(loading);
          },
        });
      }

      // 监听表格按钮
      table.on("tool(ID_recorded_video_table)", function (obj) {
        let objData = obj.data; // 当前行数据
        let layEvent = obj.event; // 获取 lay-event 的值 del, play

        //   // 在页面加载时绑定一次即可
        if (layEvent === "play") {
          playbackSessionId += 1;
          const sessionId = playbackSessionId;
          let availableDates = (objData.dates || []).slice().sort();
          if (availableDates.length === 0) {
            layer.msg("⚠️ 暂无录像", { time: 1500, offset: "t", shift: 1 });
            return;
          }
          layer.open({
            type: 1,
            title: `录像回看 - ${objData.recording_name}`,
            area: ["1040px", "820px"],
            resize: true,
            maxmin: true,
            content: $("#ID_tpl_recorded_video_player").html(),
            btn: [],
            success: function () {
              currentPlayback = {
                app: objData.app,
                stream: objData.stream,
                caseKeyword: $("#ID_record_case").val().trim(),
                sessionId: sessionId,
              };
              const $select = $("#ID_video_date");
              availableDates.forEach((date) => $select.append(`<option value="${date}">${date}</option>`));
              if (playbackController) playbackController.cleanup();
              playbackController = createPlaybackController();
              $select.val(availableDates[0]);
              form.render("select");
              $("#ID_download_selected").on("click", downloadSelectedRecordings);
              loadRecordings(objData.app, objData.stream, availableDates[0]);
            },
            end: function () {
              if (currentPlayback && currentPlayback.sessionId === sessionId) currentPlayback = null;
              if (playbackController) {
                playbackController.cleanup();
                playbackController = null;
              }
            }
          });
        } else if (layEvent === "download") {
          downloadStreamRecordings(objData);
        } else if (layEvent === "del") {
          // 删除确认
          layer.confirm(
            `确定要删除录像<span style = "margin-bottom: 6px; padding: 4px; background: #f7f7f7; border-radius: 4px;">${objData.app}/${objData.stream}</span>吗？`,
            { title: "提示" },
            function (index) {
              $.ajax({
                url: `/api/playback/streamid-record?app=${objData.app}&stream=${objData.stream}`,
                type: "DELETE",
                dataType: "json",
                timeout: 10000,
                success: function (res) {
                  if (res.code === 0) {
                    layer.msg("✅ 删除成功", {
                      time: 1500,
                      offset: "t",
                      shift: 1,
                    });
                    renderTable();
                  } else {
                    layer.msg("⚠️ 删除失败", {
                      time: 1500,
                      offset: "t",
                      shift: 1,
                    });
                  }
                },
                error: function () {
                  layer.msg("⚠️ 删除失败", {
                    time: 1500,
                    offset: "t",
                    shift: 1,
                  });
                },
              });
              layer.close(index);
            }
          );
        }
      });

      form.on("select(video_date)", function (rec) {
        if (!currentPlayback) return;
        loadRecordings(currentPlayback.app, currentPlayback.stream, rec.value);
      });

      table.on("tool(ID_recorded_segment_table)", function (obj) {
        if (obj.event === "download") downloadRecording(obj.data);
      });

      $("#ID_record_search").on("click", renderTable);
      $("#ID_record_reset").on("click", function () {
        $("#ID_record_device, #ID_record_case, #ID_record_keyword, #ID_record_start, #ID_record_end").val("");
        renderTable();
      });

      renderTable();
    });
  </script>
</body>

</html>
