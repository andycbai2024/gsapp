<div style="padding:16px">
  <div class="layui-card">
    <div class="layui-card-header">目录资源管理</div>
    <div class="layui-card-body">
      <div class="layui-tab" lay-filter="resource-tab">
        <ul class="layui-tab-title"><li class="layui-this">业务目录</li><li>谈话办案区</li><li>房间管理</li></ul>
        <div class="layui-tab-content" style="padding:16px 0">
          <div class="layui-tab-item layui-show"><div class="resource-toolbar"><span>配置多个业务目录及显示排序</span><button class="layui-btn layui-btn-sm" id="add-directory">添加目录</button></div><table class="layui-hide" id="directory-table"></table></div>
          <div class="layui-tab-item"><div class="resource-toolbar"><span>在业务目录下配置谈话办案区</span><button class="layui-btn layui-btn-sm" id="add-area">添加办案区</button></div><table class="layui-hide" id="area-table"></table></div>
          <div class="layui-tab-item"><div class="resource-toolbar"><span>管理讯问室、谈话室、调查组指挥室及其设备</span><button class="layui-btn layui-btn-sm" id="add-room">添加房间</button></div><table class="layui-hide" id="room-table"></table></div>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
  .resource-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;color:#666}
  .resource-badge{display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;white-space:nowrap}
</style>
<script type="text/html" id="directory-actions"><a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a></script>
<script type="text/html" id="area-actions"><a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a></script>
<script type="text/html" id="room-actions"><a class="layui-btn layui-btn-xs" lay-event="devices">设备</a><a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a></script>
<script>
layui.use(['table','layer','form','jquery','element'], function(){
  const table=layui.table, layer=layui.layer, form=layui.form, $=layui.jquery, element=layui.element;
  const roomTypes={interrogation:'讯问室',talk:'谈话室',investigation_command:'调查组指挥室',retention:'留置室',other:'其他'};
  let directories=[], areas=[], devices=[];
  function escapeHtml(value){return String(value==null?'':value).replace(/[&<>'"]/g,item=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[item]));}
  function api(url, method, data, done){$.ajax({url,type:method,contentType:data!==undefined?'application/json':undefined,data:data!==undefined?JSON.stringify(data):undefined,success:res=>{if(res.code===0)done(res);else layer.msg(res.msg||'操作失败');},error:xhr=>layer.msg((xhr.responseJSON||{}).msg||'请求失败')});}
  function enabled(value){return value?'<span class="layui-badge layui-bg-green">启用</span>':'<span class="layui-badge layui-bg-gray">停用</span>';}
  function loadReference(done){let pending=3; function complete(){if(!--pending)done();} api('/api/resources/directories','GET',undefined,res=>{directories=res.data||[];complete();});api('/api/resources/areas','GET',undefined,res=>{areas=res.data||[];complete();});api('/api/devices','GET',undefined,res=>{devices=res.data||[];complete();});}
  function render(){loadReference(()=>{renderDirectories();renderAreas();renderRooms();});}
  function renderDirectories(){table.render({elem:'#directory-table',data:directories,cols:[[
    {field:'sort_order',title:'排序',width:80},{field:'name',title:'目录名称',minWidth:170},{field:'code',title:'编码',width:130},{field:'description',title:'说明',minWidth:180},{title:'办案区/房间',width:130,templet:d=>`${d.area_count||0} / ${d.room_count||0}`},{title:'状态',width:90,templet:d=>enabled(d.enabled)},{title:'操作',toolbar:'#directory-actions',width:140}
  ]],page:true,limit:10});}
  function renderAreas(){table.render({elem:'#area-table',data:areas,cols:[[
    {field:'directory_name',title:'业务目录',minWidth:150},{field:'sort_order',title:'排序',width:80},{field:'name',title:'办案区名称',minWidth:170},{field:'location',title:'位置',minWidth:170},{field:'room_count',title:'房间数',width:90},{title:'状态',width:90,templet:d=>enabled(d.enabled)},{title:'操作',toolbar:'#area-actions',width:140}
  ]],page:true,limit:10});}
  function renderRooms(){api('/api/resources/rooms','GET',undefined,res=>table.render({elem:'#room-table',data:res.data||[],cols:[[
    {field:'directory_name',title:'业务目录',minWidth:130},{field:'area_name',title:'办案区',minWidth:130},{field:'name',title:'房间名称',minWidth:130},{title:'类型',width:130,templet:d=>roomTypes[d.room_type]||d.room_type},{field:'capacity',title:'容量',width:80},{field:'location',title:'位置',minWidth:140},{title:'关联设备',minWidth:180,templet:d=>`<span class="resource-badge" title="${escapeHtml(d.device_names||'')}">${escapeHtml(d.device_names||'-')} (${d.device_count||0})</span>`},{title:'状态',width:80,templet:d=>enabled(d.enabled)},{title:'操作',toolbar:'#room-actions',width:195}
  ]],page:true,limit:10}));}
  function options(rows, selected, label){return rows.map(item=>`<option value="${item.id}" ${Number(selected)===Number(item.id)?'selected':''}>${escapeHtml(label(item))}</option>`).join('');}
  function openForm(title, content, submit){layer.open({type:1,title,area:['580px','auto'],content,success:()=>form.render(),end:()=>{},btn:[],shadeClose:false});form.on('submit(resource-form)',function(obj){submit(obj.field);return false;});}
  function directoryForm(item={}){return `<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">目录名称</label><div class="layui-input-block"><input class="layui-input" name="name" required value="${escapeHtml(item.name||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">目录编码</label><div class="layui-input-block"><input class="layui-input" name="code" required placeholder="如 TALK" value="${escapeHtml(item.code||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">排序</label><div class="layui-input-block"><input type="number" class="layui-input" name="sort_order" value="${item.sort_order||0}" min="0"></div></div><div class="layui-form-item"><label class="layui-form-label">说明</label><div class="layui-input-block"><textarea class="layui-textarea" name="description">${escapeHtml(item.description||'')}</textarea></div></div><div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="enabled" title="启用" lay-skin="switch" ${item.enabled===false?'':'checked'}></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="resource-form">保存</button></div></div></form>`;}
  function areaForm(item={}){return `<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">业务目录</label><div class="layui-input-block"><select name="directory_id" required>${options(directories,item.directory_id,d=>d.name)}</select></div></div><div class="layui-form-item"><label class="layui-form-label">办案区名称</label><div class="layui-input-block"><input class="layui-input" name="name" required value="${escapeHtml(item.name||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">位置</label><div class="layui-input-block"><input class="layui-input" name="location" value="${escapeHtml(item.location||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">排序</label><div class="layui-input-block"><input type="number" class="layui-input" name="sort_order" value="${item.sort_order||0}" min="0"></div></div><div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="enabled" title="启用" lay-skin="switch" ${item.enabled===false?'':'checked'}></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="resource-form">保存</button></div></div></form>`;}
  function roomForm(item={}){return `<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">办案区</label><div class="layui-input-block"><select name="area_id" required>${options(areas,item.area_id,a=>`${a.directory_name} / ${a.name}`)}</select></div></div><div class="layui-form-item"><label class="layui-form-label">房间名称</label><div class="layui-input-block"><input class="layui-input" name="name" required value="${escapeHtml(item.name||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">房间类型</label><div class="layui-input-block"><select name="room_type">${Object.entries(roomTypes).map(([key,name])=>`<option value="${key}" ${item.room_type===key?'selected':''}>${name}</option>`).join('')}</select></div></div><div class="layui-form-item"><label class="layui-form-label">容纳人数</label><div class="layui-input-block"><input type="number" min="0" class="layui-input" name="capacity" value="${item.capacity||0}"></div></div><div class="layui-form-item"><label class="layui-form-label">位置</label><div class="layui-input-block"><input class="layui-input" name="location" value="${escapeHtml(item.location||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="enabled" title="启用" lay-skin="switch" ${item.enabled===false?'':'checked'}></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="resource-form">保存</button></div></div></form>`;}
  function normalize(data){data.enabled=data.enabled==='on';return data;}
  $('#add-directory').on('click',()=>openForm('添加业务目录',directoryForm(),data=>api('/api/resources/directories','POST',normalize(data),()=>{layer.closeAll();render();})));
  $('#add-area').on('click',()=>{if(!directories.length)return layer.msg('请先创建业务目录');openForm('添加谈话办案区',areaForm(),data=>api('/api/resources/areas','POST',normalize(data),()=>{layer.closeAll();render();}));});
  $('#add-room').on('click',()=>{if(!areas.length)return layer.msg('请先创建谈话办案区');openForm('添加房间',roomForm(),data=>api('/api/resources/rooms','POST',normalize(data),()=>{layer.closeAll();render();}));});
  table.on('tool(directory-table)',obj=>{if(obj.event==='edit')openForm('编辑业务目录',directoryForm(obj.data),data=>api(`/api/resources/directories/${obj.data.id}`,'PUT',normalize(data),()=>{layer.closeAll();render();}));if(obj.event==='delete')layer.confirm(`删除“${obj.data.name}”将同时删除其办案区和房间，是否继续？`,()=>api(`/api/resources/directories/${obj.data.id}`,'DELETE',undefined,()=>{layer.closeAll();render();}));});
  table.on('tool(area-table)',obj=>{if(obj.event==='edit')openForm('编辑谈话办案区',areaForm(obj.data),data=>api(`/api/resources/areas/${obj.data.id}`,'PUT',normalize(data),()=>{layer.closeAll();render();}));if(obj.event==='delete')layer.confirm(`删除“${obj.data.name}”将同时删除其房间，是否继续？`,()=>api(`/api/resources/areas/${obj.data.id}`,'DELETE',undefined,()=>{layer.closeAll();render();}));});
  table.on('tool(room-table)',obj=>{if(obj.event==='edit')openForm('编辑房间',roomForm(obj.data),data=>api(`/api/resources/rooms/${obj.data.id}`,'PUT',normalize(data),()=>{layer.closeAll();render();}));if(obj.event==='delete')layer.confirm(`确定删除“${obj.data.name}”？`,()=>api(`/api/resources/rooms/${obj.data.id}`,'DELETE',undefined,()=>{layer.closeAll();render();}));if(obj.event==='devices')openDeviceDialog(obj.data);});
  function openDeviceDialog(room){api(`/api/resources/rooms/${room.id}/devices`,'GET',undefined,res=>{const assigned=res.data||[];const ids=new Set(assigned.map(d=>d.device_id));const choices=devices.map(d=>`<option value="${escapeHtml(d.device_id)}">${escapeHtml(d.name)} (${escapeHtml(d.device_id)})</option>`).join('');const rows=assigned.map(d=>`<tr><td>${escapeHtml(d.name)}</td><td>${escapeHtml(d.device_id)}</td><td>${escapeHtml(d.status)}</td><td><button class="layui-btn layui-btn-xs layui-btn-danger unlink-device" data-device="${escapeHtml(d.device_id)}">解除</button></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:#999">暂未关联设备</td></tr>';const content=`<div style="padding:18px"><div class="layui-form" style="display:flex;gap:8px;margin-bottom:14px"><select id="room-device-select" style="flex:1"><option value="">选择设备</option>${choices}</select><button class="layui-btn layui-btn-sm" id="link-room-device">关联设备</button></div><table class="layui-table"><thead><tr><th>设备名称</th><th>设备 ID</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;layer.open({type:1,title:`房间设备 - ${room.name}`,area:['680px','auto'],content,success:()=>{$('#link-room-device').on('click',()=>{const deviceId=$('#room-device-select').val();if(!deviceId)return layer.msg('请选择设备');api(`/api/resources/rooms/${room.id}/devices/${encodeURIComponent(deviceId)}`,'PUT',{},()=>{layer.closeAll();render();openDeviceDialog(room);});});$('.unlink-device').on('click',function(){const deviceId=$(this).data('device');api(`/api/resources/rooms/${room.id}/devices/${encodeURIComponent(deviceId)}`,'DELETE',undefined,()=>{layer.closeAll();render();openDeviceDialog(room);});});form.render('select');}});});}
  element.on('tab(resource-tab)',function(){if(this.innerText==='房间管理')renderRooms();});
  render();
});
</script>
