<div style="padding:16px" id="ID_case_management">
  <style>
    #ID_case_management .case-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
    #ID_case_management .case-toolbar .layui-input { width:280px; }
    #ID_case_management .case-toolbar .layui-form-select { width:160px; }
    #ID_case_management .case-toolbar .layui-form-select .layui-input { width:100%; }
    #ID_case_management .case-status { font-weight:600; }
    #ID_case_management .case-status.created { color:#999; }
    #ID_case_management .case-status.assigned { color:#1e9fff; }
    #ID_case_management .case-status.handling { color:#ffb800; }
    #ID_case_management .case-status.closed { color:#16baaa; }
    #ID_case_management .workflow-board { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:8px; margin-bottom:16px; }
    #ID_case_management .workflow-step { position:relative; min-height:74px; padding:12px; color:#51606c; text-align:left; background:#f8fafb; border:1px solid #e1e8ec; cursor:pointer; }
    #ID_case_management .workflow-step:hover,#ID_case_management .workflow-step.active { border-color:#16baaa; background:#edf9f7; }
    #ID_case_management .workflow-step:not(:last-child):after { content:'›'; position:absolute; z-index:1; top:22px; right:-14px; color:#16baaa; font-size:24px; }
    #ID_case_management .workflow-step strong { display:block; margin-top:5px; color:#009b94; font-size:20px; }
    #ID_case_management .workflow-schedule { margin:0 0 16px; color:#687782; font-size:13px; }
    #ID_case_management .workflow-schedule b { color:#27313a; }
    .case-create-form,.case-create-form * { box-sizing:border-box; }
    .case-create-form { position:relative; height:100%; min-height:610px; padding-bottom:68px; background:#f5f8fc; }
    .case-create-body { position:absolute; inset:0 0 68px; overflow-y:auto; padding:18px 24px; }
    .case-create-section { margin-bottom:14px; padding:16px 14px 4px; border:1px solid #e0e8f0; background:#fff; }
    .case-create-section:last-child { margin-bottom:0; }
    .case-create-section-title { display:flex; align-items:center; gap:8px; margin:0 0 14px; color:#273746; font-size:14px; font-weight:600; }
    .case-create-section-title:before { width:3px; height:15px; background:#1e9fff; content:''; }
    .case-create-section-title small { color:#8a9aa8; font-size:12px; font-weight:400; }
    .case-create-grid { display:flex; flex-wrap:wrap; margin:0 -8px; }
    .case-create-grid .layui-form-item { clear:none; width:50%; margin:0 0 13px; padding:0 8px; }
    .case-create-grid .full-row { width:100%; }
    .case-create-grid .layui-form-label { width:78px; padding:9px 6px 9px 0; color:#536575; white-space:nowrap; }
    .case-create-grid .layui-input-block { margin-left:78px; }
    .case-create-grid .layui-input,.case-create-grid .layui-select { border-color:#d8e3ed; }
    .case-create-grid .layui-input:focus { border-color:#1e9fff !important; box-shadow:0 0 0 2px rgba(30,159,255,.10); }
    .case-create-footer { position:absolute; right:0; bottom:0; left:0; height:68px; display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:0 24px; border-top:1px solid #dbe5f0; background:#fff; }
    .case-create-footer .layui-btn { min-width:104px; }
    @media (max-width:680px) { .case-create-grid .layui-form-item,.case-create-grid .full-row { width:100%; } }
    @media (max-width:1000px) { #ID_case_management .workflow-board { grid-template-columns:repeat(3,1fr); } #ID_case_management .workflow-step:after { display:none; } }
  </style>
  <div class="layui-card">
    <div class="layui-card-header">办案流程工作台 <span class="layui-font-gray" style="font-size:12px;margin-left:8px">首页仅展示态势，案件录入与办理操作均在此处完成</span></div>
    <div class="layui-card-body">
      <div class="workflow-board">
        <button type="button" class="workflow-step" data-flow="intake" title="创建案件并下发至办案设备">案件录入<strong id="workflow-intake">0</strong></button><button type="button" class="workflow-step" data-flow="ready" title="查看等待设备接收的案件">设备接收<strong id="workflow-ready">0</strong></button><button type="button" class="workflow-step" data-flow="scheduled" title="查看已创建但尚未人工开始的办案会话">会话准备<strong id="workflow-scheduled">0</strong></button><button type="button" class="workflow-step" data-flow="handling" title="设备端正在办理的案件">设备办理<strong id="workflow-handling">0</strong></button>
      </div>
      <div class="workflow-schedule" id="workflow-schedule">正在加载待开始办案会话...</div>
    </div>
  </div>
  <div class="layui-card">
    <div class="layui-card-header">案件管理</div>
    <div class="layui-card-body">
      <form class="layui-form case-toolbar">
        <input id="ID_case_keyword" class="layui-input" placeholder="案件编号 / 案件名称 / 承办单位">
        <select id="ID_case_status_filter"><option value="">全部案件状态</option><option value="created">待下发</option><option value="assigned">已下发</option><option value="handling">办理中</option><option value="closed">已办结</option><option value="archived">已归档</option></select>
        <button type="button" id="ID_case_search" class="layui-btn layui-btn-primary"><i class="layui-icon layui-icon-search"></i> 查询</button>
        <button type="button" id="ID_case_add" class="layui-btn"><i class="layui-icon layui-icon-addition"></i> 创建案件</button>
      </form>
      <table class="layui-hide" id="ID_case_table"></table>
    </div>
  </div>
</div>

<script>
layui.use(['table', 'layer', 'form', 'element', 'jquery'], function () {
  const table = layui.table, layer = layui.layer, form = layui.form, element = layui.element, $ = layui.jquery;
  const caseTypes = { criminal:'刑事案件', administrative:'行政案件', other:'其他案件' };
  const caseStatuses = { created:'待下发', assigned:'已下发', handling:'办理中', closed:'已办结', archived:'已归档' };
  const assignmentStatuses = { pending:'待接收', received:'已接收', handling:'办理中', completed:'已完成' };
  const sessionTypes = { interrogation:'讯问', inquiry:'询问', identification:'辨认', other:'其他' };
  const sessionStatuses = { planned:'待开始', active:'进行中', finalizing:'封盘校验中', ended:'已结束', cancelled:'已取消' };
  const recordingModes = { disk:'仅硬盘录制', sync_burn:'光盘与硬盘同步录制' };
  let devices = [], rows = [], activeCase = null, activeFlow = '';

  function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
  function request(url, method, data, done) { $.ajax({ url:url, type:method, contentType:data ? 'application/json' : undefined, data:data ? JSON.stringify(data) : undefined, success:done, error:xhr => layer.msg((xhr.responseJSON && xhr.responseJSON.msg) || '请求失败') }); }
  function loadWorkflow() {
    request('/api/cases/workflow/dashboard', 'GET', null, res => {
      if (res.code !== 0) return;
      const stages = (res.data || {}).stages || {};
      ['intake','ready','scheduled','handling','evidence','closed','archived'].forEach(stage => $(`#workflow-${stage}`).text(stages[stage] || 0));
      const sessions = (res.data || {}).scheduled_sessions || [];
      $('#workflow-schedule').html(sessions.length ? `<b>待人工开始会话：</b>${sessions.slice(0, 3).map(item => `${escapeHtml(item.case_no)} · ${escapeHtml(item.session_no || '未编号会话')} · ${escapeHtml(item.room_name || '未选择房间')}`).join('　|　')}` : '暂无待人工开始的办案会话');
    });
  }
  function renderCases() {
    const keyword = $('#ID_case_keyword').val().trim().toLowerCase();
    const status = $('#ID_case_status_filter').val();
    const flowStatus = { ready:'assigned', handling:'handling', closed:'closed', archived:'archived' }[activeFlow];
    const visible = rows.filter(row => (!keyword || `${row.case_no} ${row.name} ${row.handling_unit}`.toLowerCase().includes(keyword)) && (!status || row.status === status) && (!flowStatus || row.status === flowStatus)).sort((left, right) => new Date(right.updated_at || right.created_at || 0) - new Date(left.updated_at || left.created_at || 0));
    table.render({ elem:'#ID_case_table', data:visible, page:true, limit:10, cols:[[
      {field:'case_no', title:'案件编号', minWidth:180}, {field:'name', title:'案件名称', minWidth:200},
      {field:'case_type', title:'类型', width:100, templet:row => caseTypes[row.case_type] || row.case_type}, {field:'handling_unit', title:'承办单位', minWidth:150},
      {field:'status', title:'案件状态', width:100, templet:row => `<span class="case-status ${row.status}">${caseStatuses[row.status] || row.status}</span>`},
      {field:'assigned_device_names', title:'已下发设备', minWidth:160, templet:row => row.assigned_device_names || '-'},
      {field:'created_at', title:'创建时间', minWidth:170}, {title:'操作', toolbar:'#ID_case_toolbar', width:220}
    ]] });
  }
  function loadCases() { const keyword = encodeURIComponent($('#ID_case_keyword').val().trim()); const status = encodeURIComponent($('#ID_case_status_filter').val()); request(`/api/cases?keyword=${keyword}&status=${status}`, 'GET', null, res => { if (res.code === 0) { rows = res.data || []; renderCases(); } else layer.msg(res.msg || '案件列表获取失败'); }); }
  function loadDevices(done) { request('/api/devices', 'GET', null, res => { devices = (res.data || []).filter(device => device.enabled); done && done(); }); }
  function openAssignmentDialog(caseRow) {
    activeCase = caseRow;
    if (!devices.length) return layer.msg('没有可下发的已启用设备');
    layer.open({ type:1, title:`下发案件 - ${escapeHtml(caseRow.case_no)}`, area:['520px','auto'], content:$('#ID_case_assign_form').html(), success:() => {
      $('#ID_case_assign_device').html(devices.map(device => `<option value="${escapeHtml(device.device_id)}">${escapeHtml(device.name)}（${escapeHtml(device.device_id)}）</option>`).join(''));
      form.render('select');
    }});
  }
  function openAssignmentList(caseRow) {
    request(`/api/cases/${caseRow.id}/assignments`, 'GET', null, res => {
      if (res.code !== 0) return layer.msg(res.msg || '下发记录获取失败');
      layer.open({ type:1, title:`下发记录 - ${escapeHtml(caseRow.case_no)}`, area:['720px','auto'], content:'<div style="padding:16px"><table id="ID_case_assignment_table"></table></div>', success:() => table.render({ elem:'#ID_case_assignment_table', data:res.data || [], cols:[[
        {field:'device_name', title:'设备名称', minWidth:150}, {field:'device_id', title:'设备 ID', minWidth:160},
        {field:'status', title:'设备状态', width:100, templet:row => assignmentStatuses[row.status] || row.status},
        {field:'assigned_at', title:'下发时间', minWidth:170}, {field:'acknowledged_at', title:'接收时间', minWidth:170}
      ]] }) });
    });
  }
  function renderCaseDetail(caseRow, detail, audits, auditChainValid) {
    const info = detail.case;
    const assignments = detail.assignments || [];
    const sessions = detail.sessions || [];
    const archives = detail.archives || [];
    const assignmentAccepted = assignments.some(item => item.status !== 'pending');
    const hasScheduledSession = sessions.some(item => item.status === 'planned');
    const hasActiveSession = sessions.some(item => item.status === 'active');
    const hasEndedSession = sessions.some(item => ['finalizing', 'ended'].includes(item.status));
    const stepClass = (done, current) => done ? 'done' : current ? 'current' : '';
    const steps = [
      ['案件录入', true, false],
      ['设备就绪', assignmentAccepted, info.status === 'created'],
      ['案件排期', hasScheduledSession || hasActiveSession || hasEndedSession, assignmentAccepted && !hasScheduledSession && !hasActiveSession && !hasEndedSession],
      ['设备办理', hasEndedSession, hasActiveSession || hasScheduledSession]
    ].map((step, index) => `<div class="case-workflow-step ${stepClass(step[1], step[2])}"><span>${index + 1}</span><b>${step[0]}</b></div>`).join('');
    const actions = [];
    if (info.status === 'created') actions.push('<button type="button" class="layui-btn layui-btn-sm" id="ID_case_assign_device">下发设备</button>');
    if (assignments.length) actions.push('<button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="ID_case_assignment_list">查看设备接收</button>');
    if (archives.length) actions.push(`<a class="layui-btn layui-btn-sm layui-btn-primary" href="/api/cases/${caseRow.id}/archive-package" target="_blank">下载完整归档包</a>`);
    if (assignmentAccepted && !['closed', 'archived'].includes(info.status)) actions.push('<button type="button" class="layui-btn layui-btn-sm" id="ID_case_create_session">创建办案会话</button>');
    const controllableSession = sessions.find(item => item.status === 'active') || sessions.find(item => item.status === 'planned');
    if (controllableSession) actions.push(`<button type="button" class="layui-btn layui-btn-sm ${controllableSession.status === 'active' ? 'layui-btn-danger' : 'layui-btn-normal'} case-session-command" data-id="${controllableSession.id}" data-action="${controllableSession.status === 'active' ? 'stop' : 'start'}">${controllableSession.status === 'active' ? '停止会话' : '开始会话'}</button>`);
    const content = `<style>.case-workflow-steps{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:6px;margin:16px 0}.case-workflow-step{min-height:54px;padding:8px;background:#f4f7f8;border:1px solid #e0e7ea;color:#75818a;font-size:12px}.case-workflow-step span{display:inline-block;width:18px;height:18px;margin-right:5px;text-align:center;line-height:18px;color:#fff;background:#aebac0;border-radius:50%}.case-workflow-step b{font-weight:600}.case-workflow-step.done{border-color:#95d7cf;color:#16877d;background:#edf9f7}.case-workflow-step.done span{background:#16baaa}.case-workflow-step.current{border-color:#f0b53b;color:#a66d00;background:#fff9e8}.case-workflow-step.current span{background:#ffb800}@media(max-width:800px){.case-workflow-steps{grid-template-columns:repeat(2,1fr)}}</style><div style="padding:16px">
      <div class="layui-row layui-col-space12"><div class="layui-col-md3"><b>案件编号：</b>${escapeHtml(info.case_no)}</div><div class="layui-col-md3"><b>案件索引：</b>${escapeHtml(info.case_reference || '-')}</div><div class="layui-col-md3"><b>承办单位：</b>${escapeHtml(info.handling_unit || '-')}</div><div class="layui-col-md3"><b>主办人员：</b>${escapeHtml(info.lead_investigator || '-')}</div></div>
      <div class="layui-row layui-col-space12" style="margin-top:6px"><div class="layui-col-md3"><b>案件状态：</b>${escapeHtml(caseStatuses[info.status] || info.status)}</div><div class="layui-col-md3"><b>办案类别：</b>${escapeHtml(sessionTypes[info.case_category] || (info.case_category === 'talk' ? '谈话' : info.case_category || '-'))}</div><div class="layui-col-md6"><b>案件案由：</b>${escapeHtml(info.case_reason || '-')}</div></div>
      <div class="case-workflow-steps">${steps}</div>
      <div style="margin:14px 0">${actions.join('')}</div>
      <div class="layui-tab" lay-filter="ID_case_detail_tabs"><ul class="layui-tab-title"><li class="layui-this">办案会话</li><li>设备回传音视频</li><li>光盘证据</li><li>设备命令</li><li>设备回传资料</li><li>审计轨迹</li></ul><div class="layui-tab-content">
        <div class="layui-tab-item layui-show"><table id="ID_case_detail_sessions"></table></div>
        <div class="layui-tab-item"><table id="ID_case_detail_media"></table></div>
        <div class="layui-tab-item"><table id="ID_case_detail_disc"></table></div>
        <div class="layui-tab-item"><table id="ID_case_detail_commands"></table></div>
        <div class="layui-tab-item"><table id="ID_case_detail_archives"></table></div>
        <div class="layui-tab-item"><table id="ID_case_detail_audits"></table></div>
      </div></div></div>`;
    layer.closeAll('page');
    layer.open({ type:1, title:`案件办理工作台 - ${escapeHtml(caseRow.case_no)}`, area:['1080px','720px'], content, success:(layero) => {
      element.render('tab', 'ID_case_detail_tabs');
      table.render({ elem:'#ID_case_detail_sessions', data:detail.sessions || [], page:true, limit:8, height:260, cols:[[
        {field:'session_no', title:'会话编号', minWidth:170}, {field:'session_type', title:'类型', width:90, templet:r => sessionTypes[r.session_type] || r.session_type}, {field:'subject_name', title:'被办案人', minWidth:110}, {field:'interviewer_names', title:'办案人员', minWidth:150}, {field:'recorder_name', title:'记录人', minWidth:100}, {field:'location', title:'办案场所', minWidth:130}, {field:'status', title:'状态', width:100, templet:r => sessionStatuses[r.status] || r.status}, {field:'started_at', title:'实际开始', minWidth:170}, {field:'ended_at', title:'实际结束', minWidth:170}, {title:'操作', width:190, templet:r => { const controls = r.status === 'planned' ? `<button class="layui-btn layui-btn-xs case-session-command" data-id="${r.id}" data-action="start">开始</button>` : r.status === 'active' ? `<button class="layui-btn layui-btn-xs layui-btn-danger case-session-command" data-id="${r.id}" data-action="stop">结束</button>` : ''; const archiveCount = archives.filter(item => Number(item.session_id) === Number(r.id)).length; return controls + (archiveCount ? ` <button class="layui-btn layui-btn-xs layui-btn-primary case-session-playback" data-id="${r.id}">回放材料(${archiveCount})</button> <a class="layui-btn layui-btn-xs" href="/api/cases/${caseRow.id}/sessions/${r.id}/archive-package" target="_blank">下载本次包</a>` : ''); }}
      ]] });
      table.render({ elem:'#ID_case_detail_media', data:detail.media || [], page:true, limit:8, height:260, cols:[[
        {field:'media_type', title:'类型', width:80, templet:r => r.media_type === 'video' ? '录像' : '录音'}, {field:'session_no', title:'所属会话', minWidth:170}, {field:'original_name', title:'材料文件', minWidth:170}, {field:'source_stream', title:'来源流', minWidth:180}, {field:'started_at', title:'开始时间', minWidth:170}, {field:'ended_at', title:'结束时间', minWidth:170}, {field:'integrity_status', title:'完整性', width:90}, {field:'sha256', title:'SHA-256', minWidth:180}
      ]] });
      table.render({ elem:'#ID_case_detail_archives', data:archives, page:true, limit:8, height:260, cols:[[
        {field:'archive_type', title:'资料类型', width:100, templet:r => ({transcript:'笔录版本',video:'录像',audio:'录音',document:'附件'}[r.archive_type] || r.archive_type)}, {title:'归档材料', minWidth:250, templet:r => `${escapeHtml(r.title || '未命名归档')}<br><span class="layui-font-gray">${escapeHtml(r.original_name || '-')}</span>`}, {field:'session_no', title:'所属会话', minWidth:170}, {field:'created_at', title:'归档时间', minWidth:170}, {field:'sha256', title:'SHA-256', minWidth:200}, {title:'操作', width:150, templet:r => /\.(pdf|html?|mp4|webm|mov|ogg)$/i.test(r.original_name || '') ? `<button class="layui-btn layui-btn-xs layui-btn-primary case-archive-preview" data-id="${r.id}">预览</button> <a class="layui-btn layui-btn-xs" href="/api/archives/${r.id}/download" target="_blank">下载</a>` : `<a class="layui-btn layui-btn-xs" href="/api/archives/${r.id}/download" target="_blank">下载</a>`}
      ]] });
      const discRows = (detail.sessions || []).filter(session => detail.disc_evidence && detail.disc_evidence[String(session.id)]).map(session => Object.assign({session_no:session.session_no}, detail.disc_evidence[String(session.id)]));
      table.render({ elem:'#ID_case_detail_disc', data:discRows, height:260, cols:[[
        {field:'session_no', title:'所属会话', minWidth:170}, {field:'status', title:'刻录状态', width:110}, {field:'drive_name', title:'光驱', width:100}, {field:'check_percent', title:'校验进度', width:100, templet:r => `${r.check_percent || 0}%`}, {field:'primary_hash', title:'光盘哈希', minWidth:190}, {field:'verified_hash', title:'校验哈希', minWidth:190}, {field:'verified_at', title:'校验完成时间', minWidth:170}
      ]] });
      table.render({ elem:'#ID_case_detail_commands', data:detail.commands || [], page:true, limit:8, height:260, cols:[[
        {field:'session_no', title:'所属会话', minWidth:150}, {field:'action', title:'命令', width:110}, {field:'status', title:'执行状态', width:100}, {field:'scheduled_at', title:'计划执行时间', minWidth:170}, {field:'attempt_count', title:'尝试次数', width:90}, {field:'error_message', title:'异常信息', minWidth:220}, {field:'completed_at', title:'完成时间', minWidth:170}
      ]] });
      table.render({ elem:'#ID_case_detail_audits', data:audits || [], page:true, limit:8, height:260, cols:[[
        {field:'created_at', title:'时间', minWidth:180}, {field:'action', title:'动作', minWidth:180}, {field:'actor', title:'操作主体', minWidth:130}, {field:'session_no', title:'会话', minWidth:160}, {field:'detail_json', title:'详情', minWidth:250}
      ]] });
      layero.find('#ID_case_assign_device').on('click', () => openAssignmentDialog(caseRow));
      layero.find('#ID_case_assignment_list').on('click', () => openAssignmentList(caseRow));
      layero.on('click', '.case-session-playback', function () { const sessionId = Number($(this).data('id')); const session = sessions.find(item => Number(item.id) === sessionId); const rows = archives.filter(item => Number(item.session_id) === sessionId); layer.open({ type:1, title:`办案材料回放 - ${escapeHtml(session ? session.session_no : '')}`, area:['860px','560px'], content:`<div style="padding:16px"><table id="ID_case_session_archive_table"></table></div>`, success:() => table.render({ elem:'#ID_case_session_archive_table', data:rows, page:true, limit:8, cols:[[{field:'archive_type', title:'类型', width:100}, {field:'original_name', title:'材料名称', minWidth:250}, {field:'created_at', title:'归档时间', minWidth:170}, {title:'操作', width:150, templet:r => /\.(pdf|html?|mp4|webm|mov|ogg)$/i.test(r.original_name || '') ? `<button class="layui-btn layui-btn-xs layui-btn-primary case-archive-preview" data-id="${r.id}">预览</button> <a class="layui-btn layui-btn-xs" href="/api/archives/${r.id}/download" target="_blank">下载</a>` : `<a class="layui-btn layui-btn-xs" href="/api/archives/${r.id}/download" target="_blank">下载</a>`}]] }) }); });
      layero.find('#ID_case_create_session').on('click', () => openSessionDialog(caseRow, assignments));
      $(document).off('click.case-detail-command', '.case-session-command').on('click.case-detail-command', '.case-session-command', function () { const button = $(this); request(`/api/case-sessions/${button.data('id')}/commands`, 'POST', {action:button.data('action')}, res => { if (res.code === 0) { layer.msg('命令已排队，正在等待设备执行'); setTimeout(() => openCaseDetail(caseRow), 500); } else layer.msg(res.msg || '命令创建失败'); }); });
      $(document).off('click.case-detail-reschedule', '.case-session-reschedule').on('click.case-detail-reschedule', '.case-session-reschedule', function () { const session = (detail.sessions || []).find(item => Number(item.id) === Number($(this).data('id'))); if (!session) return; const toLocal = value => String(value || '').replace('Z', '').slice(0, 16); const content = `<form class="layui-form" style="padding:18px" id="ID_case_reschedule_form" data-session-id="${session.id}"><div class="layui-form-item"><label class="layui-form-label">计划开始</label><div class="layui-input-block"><input class="layui-input" type="datetime-local" name="planned_start_at" value="${escapeHtml(toLocal(session.planned_start_at))}" required></div></div><div class="layui-form-item"><label class="layui-form-label">计划结束</label><div class="layui-input-block"><input class="layui-input" type="datetime-local" name="planned_end_at" value="${escapeHtml(toLocal(session.planned_end_at))}" required></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="case-reschedule-submit">确认重新排期</button></div></div></form>`; layer.open({ type:1, title:`重新排期 - ${escapeHtml(session.session_no)}`, area:['520px','auto'], content, success:() => form.render() }); });
      layero.on('click', '.case-archive-preview', function () { const archiveId = $(this).data('id'); layer.open({ type:2, title:'归档资料预览', area:['92%','92%'], resize:true, maxmin:true, content:`/api/archives/${archiveId}/preview` }); });
    }});
  }
  function openCaseDetail(caseRow) {
    request(`/api/cases/${caseRow.id}`, 'GET', null, detailResult => {
      if (detailResult.code !== 0) return layer.msg(detailResult.msg || '案件详情获取失败');
      request(`/api/cases/${caseRow.id}/audit-logs`, 'GET', null, auditResult => renderCaseDetail(caseRow, detailResult.data, auditResult.code === 0 ? auditResult.data : [], auditResult.code === 0 && auditResult.audit_chain_valid));
    });
  }
  function openSessionDialog(caseRow, assignments) {
    const accepted = assignments.filter(item => item.status !== 'pending');
    if (!accepted.length) return layer.msg('请等待设备接收案件后再创建办案会话');
    activeCase = caseRow;
    layer.open({ type:1, title:`创建办案会话 - ${escapeHtml(caseRow.case_no)}`, area:['620px','auto'], content:$('#ID_case_session_form').html(), success:() => {
      const renderSessionDevices = items => {
        $('#ID_case_session_device').html(items.map(item => `<option value="${escapeHtml(item.device_id)}">${escapeHtml(item.name || item.device_name)}（${escapeHtml(assignmentStatuses[item.status] || '已接收')}）</option>`).join('') || '<option value="">所选房间没有可用办案设备</option>');
        form.render('select');
      };
      renderSessionDevices(accepted);
      request('/api/resources/rooms', 'GET', null, roomResult => {
        if (roomResult.code !== 0) return;
        const rooms = (roomResult.data || []).filter(room => room.enabled);
        $('#ID_case_session_room').html('<option value="">不关联房间</option>' + rooms.map(room => `<option value="${room.id}" data-location="${escapeHtml(room.location || room.name)}">${escapeHtml(room.area_name ? room.area_name + ' / ' : '')}${escapeHtml(room.name)}</option>`).join(''));
        form.render('select');
        $('#ID_case_session_room').on('change', function () {
          const roomId = $(this).val();
          if (!roomId) { renderSessionDevices(accepted); return; }
          const selected = $(this).find('option:selected');
          if (!$('#ID_case_session_form_el [name="location"]').val()) $('#ID_case_session_form_el [name="location"]').val(selected.data('location') || '');
          request(`/api/resources/rooms/${encodeURIComponent(roomId)}/case-devices?case_id=${encodeURIComponent(caseRow.id)}`, 'GET', null, result => {
            if (result.code === 0) renderSessionDevices(result.data || []); else layer.msg(result.msg || '获取房间设备失败');
          });
        });
      });
      form.val('ID_case_session_form_el', {
        session_type: caseRow.case_category === 'talk' ? 'other' : caseRow.case_category,
        location: caseRow.interview_location || '', subject_name: caseRow.subject_name || '',
        interviewer_names: [caseRow.lead_investigator, caseRow.interviewer_two].filter(Boolean).join('、'),
        recorder_name: caseRow.recorder_name || ''
      });
      form.render('select');
    }});
  }
  function loadDeviceNoteTemplates(deviceId) {
    const selector = $('#ID_case_transcript_template_select');
    selector.html('<option value="">正在读取设备模板...</option>');
    selector.prop('disabled', true);
    form.render('select');
    request(`/api/devices/${encodeURIComponent(deviceId)}/note-templates`, 'GET', null, result => {
      const templates = result.code === 0 && Array.isArray(result.data) ? result.data : [];
      if (!templates.length) {
        selector.html('<option value="">设备未检测到可用笔录模板</option>');
        layer.msg(result.msg || '设备未检测到可用笔录模板');
      } else {
        selector.html(templates.map(template => `<option value="${escapeHtml(template)}">${escapeHtml(template)}</option>`).join(''));
        selector.prop('disabled', false);
      }
      form.render('select');
    });
  }
  function openCaseCreateDialog() {
    if (!devices.length) return layer.msg('没有可下发的已启用设备');
    layer.open({ type:1, title:'创建并下发案件', area:['920px','720px'], maxWidth:'96vw', maxHeight:'92vh', content:$('#ID_case_form').html(), success:(layero, index) => {
      $('#ID_case_device').html(devices.map(device => `<option value="${escapeHtml(device.device_id)}">${escapeHtml(device.name)}（${escapeHtml(device.device_id)}）</option>`).join(''));
      $('#ID_case_create_cancel').on('click', () => layer.close(index));
      form.render('select');
      loadDeviceNoteTemplates($('#ID_case_device').val());
    }});
  }

  $('#ID_case_search, #ID_case_status_filter').on('click change', loadCases);
  $('.workflow-step').on('click', function () {
    const flow = $(this).data('flow');
    if (flow === 'intake') return $('#ID_case_add').trigger('click');
    activeFlow = activeFlow === flow ? '' : flow;
    $('.workflow-step').removeClass('active');
    if (activeFlow) $(this).addClass('active');
    const labels = { ready:'已下发，等待设备接收', scheduled:'会话已创建，请在案件工作台人工开始', handling:'设备正在办案' };
    if (activeFlow === 'scheduled') {
      activeFlow = '';
      layer.msg(labels[flow]);
    }
    renderCases();
  });
  $('#ID_case_add').on('click', openCaseCreateDialog);
  if (new URLSearchParams(window.location.search).get('action') === 'create') {
    setTimeout(() => $('#ID_case_add').trigger('click'), 0);
  }
  form.on('select(case-device)', data => loadDeviceNoteTemplates(data.value));
  form.on('submit(case-submit)', data => { if (!data.field.transcript_template) return layer.msg('请选择目标设备中的笔录模板'), false; request('/api/cases', 'POST', data.field, res => { if (res.code === 0) { layer.closeAll(); layer.msg('案件已创建并下发至设备'); loadWorkflow(); loadCases(); } else layer.msg(res.msg); }); return false; });
  form.on('submit(case-assign-submit)', data => { if (!activeCase) return false; request(`/api/cases/${activeCase.id}/assignments`, 'POST', data.field, res => { if (res.code === 0) { layer.closeAll(); layer.msg('案件已下发至设备'); loadCases(); } else layer.msg(res.msg); }); return false; });
  form.on('submit(case-session-submit)', data => { if (!activeCase) return false; request(`/api/cases/${activeCase.id}/sessions`, 'POST', data.field, res => { if (res.code === 0) { layer.closeAll(); layer.msg('办案会话已创建，请由现场办案人员手动开始'); openCaseDetail(activeCase); } else layer.msg(res.msg); }); return false; });
  form.on('submit(case-reschedule-submit)', data => { const payload = Object.assign({}, data.field); const sessionId = Number($('#ID_case_reschedule_form').data('session-id')); ['planned_start_at', 'planned_end_at'].forEach(field => { if (payload[field]) payload[field] = new Date(payload[field]).toISOString(); }); if (!sessionId) return false; request(`/api/case-sessions/${sessionId}/reschedule`, 'POST', payload, res => { if (res.code === 0) { layer.closeAll(); layer.msg('办案会话已重新排期'); openCaseDetail(activeCase); } else layer.msg(res.msg || '重新排期失败'); }); return false; });
  table.on('tool(ID_case_table)', obj => { if (obj.event === 'detail') openCaseDetail(obj.data); if (obj.event === 'assign') openAssignmentDialog(obj.data); });
  form.render('select');
  loadDevices(() => { loadWorkflow(); loadCases(); });
});
</script>
