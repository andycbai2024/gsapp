<div class="preview-page"><div class="preview-sidebar"><div class="preview-title">实时预览</div><input id="preview-filter" class="layui-input" placeholder="筛选应用名或流 ID"><div id="preview-streams" class="preview-streams"></div></div><div class="preview-main"><div class="preview-header"><span id="preview-name">请选择实时流</span><span id="preview-state"></span></div><div id="preview-stage" class="preview-stage"><video id="preview-video" autoplay muted playsinline></video><div id="preview-empty">从左侧选择一个实时流</div></div><div class="preview-tools"><button class="layui-btn layui-btn-primary" id="preview-audio"><i class="layui-icon layui-icon-volume"></i></button><button class="layui-btn layui-btn-primary" id="preview-snapshot"><i class="layui-icon layui-icon-camera"></i></button><button class="layui-btn layui-btn-danger" id="preview-event-record"><i class="layui-icon layui-icon-video"></i> 即时录像</button><button class="layui-btn layui-btn-primary" id="preview-fullscreen"><i class="layui-icon layui-icon-screen-full"></i></button><button class="layui-btn layui-btn-disabled" title="需接入设备云台协议后启用"><i class="layui-icon layui-icon-rate"></i> 云台待适配</button><button class="layui-btn layui-btn-disabled" title="需接入设备报警输出协议后启用">报警输出待适配</button></div></div></div><style>.preview-page{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 40px);background:#eef1f3}.preview-sidebar{background:#fff;border-right:1px solid #dfe5ea;padding:16px}.preview-title{font-weight:600;font-size:16px;color:#27313a;margin-bottom:14px}.preview-streams{margin-top:12px;max-height:calc(100vh - 150px);overflow:auto}.preview-stream{padding:10px 8px;border-bottom:1px solid #edf0f2;cursor:pointer}.preview-stream:hover,.preview-stream.active{background:#e8f7f4;color:#087f74}.preview-stream small{display:block;color:#8a94a3;margin-top:3px}.preview-main{padding:18px;min-width:0}.preview-header{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:600;color:#27313a}.preview-stage{position:relative;display:flex;align-items:center;justify-content:center;background:#1e2932;aspect-ratio:16/9;max-height:calc(100vh - 160px)}.preview-stage video{width:100%;height:100%;object-fit:contain}.preview-stage #preview-empty{position:absolute;color:#cbd5dc}.preview-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.preview-tools .layui-btn{margin:0}</style><script>layui.use(['jquery','layer'],function(){const $=layui.jquery,layer=layui.layer;let streams=[],current=null;const video=document.getElementById('preview-video');function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){const q=$('#preview-filter').val().trim().toLowerCase();$('#preview-streams').html(streams.filter(s=>(s.app+' '+s.stream).toLowerCase().includes(q)).map(s=>'<div class="preview-stream '+(current&&current.app===s.app&&current.stream===s.stream?'active':'')+'" data-app="'+esc(s.app)+'" data-stream="'+esc(s.stream)+'"><b>'+esc(s.stream)+'</b><small>'+esc(s.app)+' / '+esc(s.schema||'fmp4')+'</small></div>').join('')||'<div style="color:#999;padding:12px">暂无可预览流</div>');}function load(){ $.get('/api/stream/streamid-list?schema=fmp4',res=>{if(res.code===0){streams=res.data||[];render();}else layer.msg(res.msg||'获取流失败');});}function play(app,stream){current={app,stream};const url=window.location.protocol+'//'+window.location.hostname+':8080/'+encodeURIComponent(app)+'/'+encodeURIComponent(stream)+'.live.mp4';video.src=url;video.play().catch(()=>{});$('#preview-name').text(app+' / '+stream);$('#preview-empty').hide();$('#preview-state').text('实时预览');render();}$('#preview-filter').on('input',render);$('body').on('click','.preview-stream',function(){play($(this).data('app'),$(this).data('stream'));});$('#preview-audio').on('click',()=>{video.muted=!video.muted;$('#preview-audio').toggleClass('layui-btn-warm',!video.muted);});$('#preview-fullscreen').on('click',()=>document.getElementById('preview-stage').requestFullscreen&&document.getElementById('preview-stage').requestFullscreen());$('#preview-snapshot').on('click',()=>{if(!current||!video.videoWidth)return layer.msg('请等待视频画面加载');const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);const link=document.createElement('a');link.href=canvas.toDataURL('image/png');link.download=current.stream+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';link.click();});$('#preview-event-record').on('click',()=>{if(!current)return layer.msg('请选择实时流');const path='events/'+current.app+'/'+current.stream+'-'+Date.now()+'.mp4';$.get('/api/playback/event-record',{app:current.app,stream:current.stream,path,back_ms:30000,forward_ms:60000},res=>{if(res.code===0)layer.msg('即时录像已启动：回溯 30 秒，继续录制 60 秒');else layer.msg(res.msg||'即时录像启动失败');});});video.addEventListener('error',()=>$('#preview-state').text('播放连接失败'));load();});</script>
