<div style="padding:16px">
  <div class="layui-card"><div class="layui-card-header">组织与人员管理</div><div class="layui-card-body">
    <div class="layui-tab" lay-filter="organization-tab"><ul class="layui-tab-title"><li class="layui-this">组织机构</li><li>人员档案</li></ul><div class="layui-tab-content" style="padding:16px 0">
      <div class="layui-tab-item layui-show"><div class="toolbar"><span>单位、部门与显示排序</span><button class="layui-btn layui-btn-sm" id="add-organization">添加组织</button></div><table class="layui-hide" id="organization-table"></table></div>
      <div class="layui-tab-item"><div class="toolbar"><div><input id="personnel-keyword" class="layui-input" placeholder="姓名、工号、电话" style="width:240px;display:inline-block"><button class="layui-btn layui-btn-primary layui-btn-sm" id="search-personnel">查询</button></div><button class="layui-btn layui-btn-sm" id="add-personnel">添加人员</button></div><table class="layui-hide" id="personnel-table"></table></div>
    </div></div>
  </div></div>
</div>
<style>.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#666}</style>
<script type="text/html" id="organization-actions"><a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a></script>
<script type="text/html" id="personnel-actions"><a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a></script>
<script>
layui.use(['table','layer','form','jquery'],function(){
 const table=layui.table,layer=layui.layer,form=layui.form,$=layui.jquery;let organizations=[];
 function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function api(url,method,data,done){$.ajax({url,type:method,contentType:data!==undefined?'application/json':undefined,data:data!==undefined?JSON.stringify(data):undefined,success:res=>res.code===0?done(res):layer.msg(res.msg||'操作失败'),error:xhr=>layer.msg((xhr.responseJSON||{}).msg||'请求失败')});}
 function loadOrganizations(done){api('/api/organizations','GET',undefined,res=>{organizations=res.data||[];renderOrganizations();if(done)done();});}
 function status(value){return value?'<span class="layui-badge layui-bg-green">启用</span>':'<span class="layui-badge layui-bg-gray">停用</span>';}
 function renderOrganizations(){table.render({elem:'#organization-table',data:organizations,cols:[[
   {field:'sort_order',title:'排序',width:80},{field:'name',title:'组织名称',minWidth:170},{field:'code',title:'编码',width:130},{field:'parent_name',title:'上级组织',minWidth:140,templet:d=>d.parent_name||'-'},{field:'personnel_count',title:'人员数',width:90},{title:'状态',width:90,templet:d=>status(d.enabled)},{title:'操作',toolbar:'#organization-actions',width:140}
 ]],page:true,limit:10});}
 function renderPersonnel(){const keyword=$('#personnel-keyword').val().trim();api('/api/personnel?keyword='+encodeURIComponent(keyword),'GET',undefined,res=>table.render({elem:'#personnel-table',data:res.data||[],cols:[[
   {field:'name',title:'姓名',width:110},{field:'employee_no',title:'工号',width:120},{field:'organization_name',title:'组织',minWidth:140,templet:d=>d.organization_name||'-'},{field:'title',title:'职务',width:120},{field:'phone',title:'电话',width:130},{field:'username',title:'平台账号',width:130,templet:d=>d.username||'-'},{title:'状态',width:90,templet:d=>status(d.enabled)},{title:'操作',toolbar:'#personnel-actions',width:140}
 ]],page:true,limit:10}));}
 function orgOptions(selected,exclude){return '<option value="">无上级组织</option>'+organizations.filter(o=>o.id!==exclude).map(o=>`<option value="${o.id}" ${Number(selected)===Number(o.id)?'selected':''}>${esc(o.name)}</option>`).join('');}
 function organizationForm(item={}){return `<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">上级组织</label><div class="layui-input-block"><select name="parent_id">${orgOptions(item.parent_id,item.id)}</select></div></div><div class="layui-form-item"><label class="layui-form-label">组织名称</label><div class="layui-input-block"><input class="layui-input" name="name" required value="${esc(item.name||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">组织编码</label><div class="layui-input-block"><input class="layui-input" name="code" required value="${esc(item.code||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">排序</label><div class="layui-input-block"><input class="layui-input" type="number" min="0" name="sort_order" value="${item.sort_order||0}"></div></div><div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="enabled" lay-skin="switch" title="启用" ${item.enabled===false?'':'checked'}></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="organization-form">保存</button></div></div></form>`;}
 function personnelForm(item={}){const options='<option value="">未分配组织</option>'+organizations.map(o=>`<option value="${o.id}" ${Number(item.organization_id)===Number(o.id)?'selected':''}>${esc(o.name)}</option>`).join('');const newPerson=!item.id;return `<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">所属组织</label><div class="layui-input-block"><select name="organization_id">${options}</select></div></div><div class="layui-form-item"><label class="layui-form-label">姓名</label><div class="layui-input-block"><input class="layui-input" name="name" required value="${esc(item.name||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">工号</label><div class="layui-input-block"><input class="layui-input" name="employee_no" required value="${esc(item.employee_no||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">职务</label><div class="layui-input-block"><input class="layui-input" name="title" value="${esc(item.title||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input class="layui-input" name="phone" value="${esc(item.phone||'')}"></div></div><div class="layui-form-item"><label class="layui-form-label">证件号</label><div class="layui-input-block"><input class="layui-input" name="identity_no" value="${esc(item.identity_no||'')}"></div></div>${newPerson?'<div class="layui-form-item"><label class="layui-form-label">创建平台账号</label><div class="layui-input-block"><input type="checkbox" name="create_account" lay-skin="switch" title="创建"></div></div><div class="layui-form-item"><label class="layui-form-label">账号名称</label><div class="layui-input-block"><input class="layui-input" name="username" placeholder="默认使用工号"></div></div>':''}<div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="enabled" lay-skin="switch" title="启用" ${item.enabled===false?'':'checked'}></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="personnel-form">保存</button></div></div></form>`;}
 function open(title,content,filter,submit){layer.open({type:1,title,area:['580px','auto'],content,success:()=>form.render()});form.on('submit('+filter+')',obj=>{obj.field.enabled=obj.field.enabled==='on';obj.field.create_account=obj.field.create_account==='on';submit(obj.field);return false;});}
 $('#add-organization').on('click',()=>open('添加组织',organizationForm(),'organization-form',data=>api('/api/organizations','POST',data,()=>{layer.closeAll();loadOrganizations();})));
 $('#add-personnel').on('click',()=>open('添加人员',personnelForm(),'personnel-form',data=>api('/api/personnel','POST',data,res=>{const message=res.initial_password?`人员和账号已创建，初始密码：${esc(res.initial_password)}`:'人员已创建';layer.alert(message,{title:'创建成功'},()=>{layer.closeAll();renderPersonnel();});})));
 $('#search-personnel').on('click',renderPersonnel);
 table.on('tool(organization-table)',obj=>{if(obj.event==='edit')open('编辑组织',organizationForm(obj.data),'organization-form',data=>api('/api/organizations/'+obj.data.id,'PUT',data,()=>{layer.closeAll();loadOrganizations();}));if(obj.event==='delete')layer.confirm('删除组织会同时删除其下级组织，人员档案将保留但不再归属该组织。确定继续？',()=>api('/api/organizations/'+obj.data.id,'DELETE',undefined,()=>{layer.closeAll();loadOrganizations();renderPersonnel();}));});
 table.on('tool(personnel-table)',obj=>{if(obj.event==='edit')open('编辑人员',personnelForm(obj.data),'personnel-form',data=>api('/api/personnel/'+obj.data.id,'PUT',data,()=>{layer.closeAll();renderPersonnel();}));if(obj.event==='delete')layer.confirm('确定删除该人员档案？关联的平台账号不会被删除。',()=>api('/api/personnel/'+obj.data.id,'DELETE',undefined,()=>{layer.closeAll();renderPersonnel();}));});
 loadOrganizations(renderPersonnel);
});
</script>
