<div class="access-page"><div class="layui-card"><div class="layui-card-header">门禁管理</div><div class="layui-card-body"><div class="layui-tab" lay-filter="access-tabs"><ul class="layui-tab-title"><li class="layui-this">门禁点</li><li>权限配置</li><li>进出事件</li></ul><div class="layui-tab-content"><div class="layui-tab-item layui-show"><div class="access-toolbar"><span>门禁点关联设备和谈话房间</span><button class="layui-btn" id="access-add-point">添加门禁点</button></div><table class="layui-hide" id="access-point-table"></table></div><div class="layui-tab-item"><div class="access-toolbar"><span>权限变更将回到待设备下发状态</span><button class="layui-btn" id="access-add-permission">配置权限</button></div><table class="layui-hide" id="access-permission-table"></table></div><div class="layui-tab-item"><div class="access-toolbar"><span>来自门禁设备的实时进出记录</span><button class="layui-btn layui-btn-primary" id="access-refresh-events">刷新</button></div><table class="layui-hide" id="access-event-table"></table></div></div></div></div></div></div><style>.access-page{padding:16px}.access-toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;color:#667085}.access-toolbar .layui-btn{margin:0}</style><script type="text/html" id="access-point-actions"><a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a></script><script type="text/html" id="access-permission-actions"><a class="layui-btn layui-btn-xs" lay-event="delivery">下发状态</a><a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">撤销</a></script><script>layui.use(['table','layer','form','jquery','element'],function(){const table=layui.table,layer=layui.layer,form=layui.form,$=layui.jquery;let devices=[],rooms=[],people=[],points=[];function esc(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}function api(url,method,data,done){$.ajax({url,type:method,contentType:data===undefined?undefined:'application/json',data:data===undefined?undefined:JSON.stringify(data),success:response=>response.code===0?done(response):layer.msg(response.msg||'操作失败'),error:xhr=>layer.msg((xhr.responseJSON||{}).msg||'请求失败')});}function selected(items,current,label){return '<option value="">未关联</option>'+items.map(item=>'<option value="'+esc(item.id||item.device_id)+'" '+(String(item.id||item.device_id)===String(current||'')?'selected':'')+'>'+esc(label(item))+'</option>').join('');}function loadReference(done){let remaining=3;const finish=()=>{if(!--remaining)done();};api('/api/devices','GET',undefined,res=>{devices=res.data||[];finish();});api('/api/resources/rooms','GET',undefined,res=>{rooms=res.data||[];finish();});api('/api/personnel','GET',undefined,res=>{people=res.data||[];finish();});}function renderPoints(){api('/api/access-points','GET',undefined,res=>{points=res.data||[];table.render({elem:'#access-point-table',data:points,cols:[[{field:'name',title:'门禁点',minWidth:150},{field:'point_code',title:'编码',width:150},{field:'room_name',title:'房间',minWidth:130,templet:item=>item.room_name||'-'},{field:'device_name',title:'控制设备',minWidth:150,templet:item=>item.device_name||'-'},{field:'enabled',title:'状态',width:90,templet:item=>item.enabled?'启用':'停用'},{title:'操作',toolbar:'#access-point-actions',width:140}]],page:true,limit:20});});}function renderPermissions(){api('/api/access-permissions','GET',undefined,res=>table.render({elem:'#access-permission-table',data:res.data||[],cols:[[{field:'personnel_name',title:'人员',width:120},{field:'employee_no',title:'工号',width:120},{field:'point_name',title:'门禁点',minWidth:140},{field:'auth_method',title:'认证方式',width:110},{field:'valid_from',title:'生效',minWidth:145,templet:item=>item.valid_from||'长期'},{field:'valid_to',title:'失效',minWidth:145,templet:item=>item.valid_to||'长期'},{field:'schedule_template',title:'时段计划',width:120,templet:item=>item.schedule_template||'-'},{field:'holiday_plan',title:'假日计划',width:120,templet:item=>item.holiday_plan||'-'},{field:'delivery_status',title:'下发状态',width:110},{title:'操作',toolbar:'#access-permission-actions',width:160}]],page:true,limit:20}));}function renderEvents(){api('/api/access-events','GET',undefined,res=>table.render({elem:'#access-event-table',data:res.data||[],cols:[[{field:'event_time',title:'时间',minWidth:165},{field:'personnel_name',title:'人员',width:120,templet:item=>item.personnel_name||'未知人员'},{field:'employee_no',title:'工号',width:110,templet:item=>item.employee_no||'-'},{field:'point_name',title:'门禁点',minWidth:140},{field:'direction',title:'方向',width:90,templet:item=>item.direction==='in'?'进入':'离开'},{field:'snapshot_url',title:'抓拍',width:90,templet:item=>item.snapshot_url?'<a href="'+esc(item.snapshot_url)+'" target="_blank">查看</a>':'-'}]],page:true,limit:20}));}function pointForm(item){item=item||{};return '<form class="layui-form" id="access-point-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-block"><input class="layui-input" name="name" required value="'+esc(item.name)+'"></div></div><div class="layui-form-item"><label class="layui-form-label">编码</label><div class="layui-input-block"><input class="layui-input" name="point_code" required value="'+esc(item.point_code)+'"></div></div><div class="layui-form-item"><label class="layui-form-label">控制设备</label><div class="layui-input-block"><select name="device_id">'+selected(devices,item.device_id,device=>device.name+' / '+device.device_id)+'</select></div></div><div class="layui-form-item"><label class="layui-form-label">谈话房间</label><div class="layui-input-block"><select name="room_id">'+selected(rooms,item.room_id,room=>room.name)+'</select></div></div><div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="enabled" lay-skin="switch" '+(item.enabled===undefined||item.enabled?'checked':'')+'></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="access-point-submit">保存</button></div></div></form>';}function openPoint(item){layer.open({type:1,title:item?'编辑门禁点':'添加门禁点',area:['520px','auto'],content:pointForm(item),success:()=>form.render()});}function openPermission(){const pointOptions=points.map(item=>'<option value="'+item.id+'">'+esc(item.name)+'</option>').join('');const personOptions=people.map(item=>'<option value="'+item.id+'">'+esc(item.name)+' / '+esc(item.employee_no)+'</option>').join('');layer.open({type:1,title:'配置门禁权限',area:['560px','auto'],content:'<form class="layui-form" id="access-permission-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">人员</label><div class="layui-input-block"><select name="personnel_id">'+personOptions+'</select></div></div><div class="layui-form-item"><label class="layui-form-label">门禁点</label><div class="layui-input-block"><select name="access_point_id">'+pointOptions+'</select></div></div><div class="layui-form-item"><label class="layui-form-label">认证方式</label><div class="layui-input-block"><select name="auth_method"><option value="card">刷卡</option><option value="face">人脸</option><option value="fingerprint">指纹</option><option value="card_face">刷卡加人脸</option><option value="card_fingerprint">刷卡加指纹</option></select></div></div><div class="layui-form-item"><label class="layui-form-label">生效时间</label><div class="layui-input-block"><input class="layui-input" type="datetime-local" name="valid_from"></div></div><div class="layui-form-item"><label class="layui-form-label">失效时间</label><div class="layui-input-block"><input class="layui-input" type="datetime-local" name="valid_to"></div></div><div class="layui-form-item"><label class="layui-form-label">时段计划</label><div class="layui-input-block"><input class="layui-input" name="schedule_template" placeholder="例如：工作日 08:00-18:00"></div></div><div class="layui-form-item"><label class="layui-form-label">假日计划</label><div class="layui-input-block"><input class="layui-input" name="holiday_plan" placeholder="例如：法定节假日禁用"></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="access-permission-submit">保存并待下发</button></div></div></form>',success:()=>form.render()});}form.on('submit(access-point-submit)',data=>{const item=data.field;item.enabled=!!item.enabled;const editing=points.find(point=>point.name===item.name&&point.point_code===item.point_code);const selectedPoint=window.accessEditingPoint;api(selectedPoint?'/api/access-points/'+selectedPoint.id:'/api/access-points',selectedPoint?'PUT':'POST',item,()=>{layer.closeAll();renderPoints();layer.msg('已保存');});return false;});form.on('submit(access-permission-submit)',data=>{api('/api/access-permissions','POST',data.field,()=>{layer.closeAll();renderPermissions();layer.msg('权限已保存，等待设备下发');});return false;});table.on('tool(access-point-table)',obj=>{if(obj.event==='delete')layer.confirm('删除门禁点将同时清除相关权限，是否继续？',()=>api('/api/access-points/'+obj.data.id,'DELETE',undefined,()=>{renderPoints();renderPermissions();layer.msg('已删除');}));if(obj.event==='edit'){window.accessEditingPoint=obj.data;openPoint(obj.data);}});table.on('tool(access-permission-table)',obj=>{if(obj.event==='delete')layer.confirm('撤销该人员的门禁权限？',()=>api('/api/access-permissions/'+obj.data.id,'DELETE',undefined,()=>{renderPermissions();layer.msg('已撤销');}));if(obj.event==='delivery')layer.prompt({title:'更新下发状态',formType:0,value:obj.data.delivery_status},value=>{if(!['pending','delivering','succeeded','failed'].includes(value))return layer.msg('请输入 pending、delivering、succeeded 或 failed');api('/api/access-permissions/'+obj.data.id+'/delivery','PUT',{delivery_status:value},()=>{layer.closeAll();renderPermissions();});});});$('#access-add-point').on('click',()=>{window.accessEditingPoint=null;openPoint();});$('#access-add-permission').on('click',openPermission);$('#access-refresh-events').on('click',renderEvents);loadReference(()=>{renderPoints();renderPermissions();renderEvents();});});</script>
