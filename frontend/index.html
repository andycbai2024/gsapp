<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>集中管理平台</title>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport" />
  <link href="assets/layui/css/layui.css" rel="stylesheet" />
  <link href="assets/iconfont/iconfont.css?v=20260806" rel="stylesheet" />
  <link href="./assets/favicon.svg?v=20260805b" rel="icon" type="image/svg+xml" />
  <style>
    body { visibility: hidden; }
    body.is-authenticated { visibility: visible; }

    .layui-layer-title {
      background: #fafafa;
      height: 35px;
      line-height: 40px;
    }

    .layui-layer-setwin {
      top: 10px;
    }

    .layui-btn {
      border-radius: 5px;
    }

    .layui-layer {
      border-radius: 10px;
    }

    .layui-layer-title {
      border-radius: 10px;
    }

    .layui-card {
      border-radius: 8px;
    }

    .layui-nav .layui-this:after,
    .layui-nav-bar {
      display: none;
    }

    .layui-header .layui-nav {
      background: transparent;
    }

    #header-tools {
      left: 200px;
    }

    #header-tools .layui-nav-item > a {
      padding: 0 8px;
    }

    .layui-header .layui-nav .layui-nav-item > a {
      color: #27313a;
    }

    .layui-header .layui-nav .layui-nav-item > a:hover {
      color: #009b94;
    }

    .layui-header .layui-nav .layui-nav-more {
      border-top-color: #27313a;
    }

    .layui-header .layui-nav #ID_logout {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      margin: 16px 0;
      padding: 0 10px;
      color: #fff;
      font-size: 13px;
      line-height: 28px;
      background: #009b94;
      border-radius: 4px;
    }

    .layui-header .layui-nav #ID_logout:hover {
      color: #fff;
      background: #007f79;
    }

    .layui-logo .logo-mark {
      display: block;
      width: 76px;
      height: 36px;
      margin: 12px auto;
    }

    .preview-page {
      height: calc(100vh - 60px) !important;
      min-height: 0 !important;
      overflow: hidden;
    }

    .preview-sidebar {
      min-height: 0;
    }

    .preview-main {
      display: flex !important;
      flex-direction: column;
      min-height: 0;
    }

    .preview-stage {
      flex: 1;
      min-height: 0;
      aspect-ratio: auto !important;
      max-height: none !important;
    }

    .layui-side .layui-nav-tree a {
      height: 40px;
      line-height: 40px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .layui-side .layui-nav-tree .layui-nav-item {
      height: 40px;
      line-height: 40px;
    }

    #platform-watermark {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      overflow: hidden;
      display: none;
      opacity: .12;
    }

    #platform-watermark span {
      position: absolute;
      color: #27313a;
      font-size: 14px;
      transform: rotate(-24deg);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="layui-layout layui-layout-admin">
    <div class="layui-header" style="background-color: #fafafa;">
      <div class="layui-logo" style="background-color: #2f363c;" title="集中管理平台">
        <img src="./assets/internal-justice-logo.svg" alt="集中管理平台" class="logo-mark">
        <span class="logo-text" style="display: none;">集中管理平台</span>
        <img src="./assets/logo.svg" alt="logo" class="logo-icon" style="display: none;">
      </div>

      <!-- 头部区域 -->
      <ul class="layui-nav layui-layout-left" id="header-tools">

        <li class="layui-nav-item" lay-header-event="toggleSidebar" title="展开/收缩侧边栏">
          <a>
            <i class="layui-icon layui-icon-shrink-right" style="color: #23292e; font-size: 1.2rem;"></i>
          </a>
        </li>

        <li class="layui-nav-item" lay-header-event="refreshPage" title="刷新当前页面">
          <a>
            <i class="layui-icon layui-icon-refresh layui-anim" style="color: #23292e; font-size: 1.2rem;"></i>
          </a>
        </li>
      </ul>

      <ul class="layui-nav layui-layout-left" id="portal-quick-links" style="left:112px"></ul>

      <ul class="layui-nav layui-layout-right" style="padding: 0 16px;">
      </ul>
    </div>

    <div class="layui-side layui-bg-black">
      <div class="layui-side-scroll">
        <ul class="layui-nav layui-nav-tree">
          <li class="layui-nav-item">
            <a data-page="./pages/home.html"><i class="gsapp-icon gsapp-icon-home"
                style="margin-right: 20px"></i>首页概览</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/cases.html"><i class="gsapp-icon gsapp-icon-case"
                style="margin-right: 20px"></i>案件管理</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/devices.html"><i class="gsapp-icon gsapp-icon-monitor"
                style="margin-right: 20px"></i>设备管理</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/resources.html"><i class="gsapp-icon gsapp-icon-resources"
                style="margin-right: 20px"></i>目录资源</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/video-preview.html"><i class="gsapp-icon gsapp-icon-preview"
                style="margin-right: 20px"></i>实时预览</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/gb28181-preview.html"><i class="gsapp-icon gsapp-icon-gb28181"
                style="margin-right: 20px"></i>国标预览</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/playback.html"><i class="gsapp-icon gsapp-icon-playback"
                style="margin-right: 20px"></i>录像回看</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/video-wall.html"><i class="gsapp-icon gsapp-icon-wall"
                style="margin-right: 20px"></i>分屏展示</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/pull-stream.html"><i class="gsapp-icon gsapp-icon-pull-stream"
                style="margin-right: 20px"></i>拉流接入</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/push-stream.html"><i class="gsapp-icon gsapp-icon-push-stream"
                style="margin-right: 20px"></i>推流接入</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/gb28181-settings.html"><i class="gsapp-icon gsapp-icon-gb28181-settings"
                style="margin-right: 20px"></i>国标接入</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/remote-hearing.html"><i class="gsapp-icon gsapp-icon-command"
                style="margin-right: 20px"></i>远程提审</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/organization.html"><i class="gsapp-icon gsapp-icon-organization"
                style="margin-right: 20px"></i>组织人员</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/portal-settings.html"><i class="gsapp-icon gsapp-icon-security"
                style="margin-right: 20px"></i>门户安全</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/alarms.html"><i class="gsapp-icon gsapp-icon-alarm"
                style="margin-right: 20px"></i>紧急报警</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/access-control.html"><i class="gsapp-icon gsapp-icon-access"
                style="margin-right: 20px"></i>门禁管理</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/remote-command.html"><i class="gsapp-icon gsapp-icon-command"
                style="margin-right: 20px"></i>远程指挥</a>
          </li>
        </ul>

        <ul class="layui-nav layui-nav-tree">
          <li class="layui-nav-item">
            <a data-page="./pages/users.html"><i class="gsapp-icon gsapp-icon-users"
                style="margin-right: 20px"></i>用户管理</a>
          </li>
        </ul>

        <ul class="layui-nav layui-nav-tree">
          <li class="layui-nav-item">
            <a data-page="./pages/settings.html"><i class="gsapp-icon gsapp-icon-settings"
                style="margin-right: 20px"></i>基础配置</a>
          </li>
          <li class="layui-nav-item">
            <a data-page="./pages/system-maintenance.html"><i class="gsapp-icon gsapp-icon-maintenance"
                style="margin-right: 20px"></i>系统维护</a>
          </li>
        </ul>

        <ul class="layui-nav layui-nav-tree" style="margin-top: 24px; border-top: 1px solid #3c454d; padding-top: 8px;">
          <li class="layui-nav-item">
            <a data-page="./pages/home.html?view=ops"><i class="gsapp-icon gsapp-icon-operations"
                style="margin-right: 20px"></i>运维信息</a>
          </li>
        </ul>
      </div>
    </div>

    <div class="layui-body" style="background-color: #eeeeee; overflow-y: auto; padding: 0px;"></div>
    <div id="platform-watermark"></div>

    <script src="assets/layui/layui.js"></script>
    <script src="./assets/echarts.min.js"></script>

    <script>

      layui.use(["util", "jquery", "element"], function () {

        let util = layui.util;
        let $ = layui.jquery;
        let element = layui.element;

        function renderUserNav(user) {
          const username = user && user.username ? user.username : "用户";
          const roleNames = { admin: "管理员", operator: "操作员", viewer: "查看者" };
          const role = roleNames[user && user.role] || "用户";
          $(".layui-layout-right").html(`
            <li class="layui-nav-item">
              <a href="javascript:;"><i class="layui-icon layui-icon-username"></i> ${username}（${role}）</a>
              <dl class="layui-nav-child"><dd><a href="javascript:;" id="ID_change_password"><i class="layui-icon layui-icon-password"></i> 修改密码</a></dd></dl>
            </li>
            <li class="layui-nav-item"><a href="javascript:;" id="ID_logout" title="退出登录"><i class="layui-icon layui-icon-logout"></i> 退出</a></li>`);
          element.render("nav");
        }

        function applyPlatformSettings(settings, user) {
          const portal = settings.portal || {};
          const security = settings.security || {};
          const title = portal.title || '集中管理平台';
          document.title = title;
          $('.logo-text').text(title);
          if (portal.logo_url) $('.logo-icon').attr('src', portal.logo_url);
          const pageMap = { devices: './pages/devices.html', resources: './pages/resources.html', 'video-preview': './pages/video-preview.html', 'gb28181-preview': './pages/gb28181-preview.html', cases: './pages/cases.html', 'remote-hearing': './pages/remote-hearing.html', organization: './pages/organization.html', alarms: './pages/alarms.html', 'access-control': './pages/access-control.html', 'remote-command': './pages/remote-command.html', 'video-wall': './pages/video-wall.html', playback: './pages/playback.html', 'portal-settings': './pages/portal-settings.html', 'gb28181-settings': './pages/gb28181-settings.html' };
          Object.entries(pageMap).forEach(([key, page]) => $(`a[data-page="${page}"]`).parent().toggle(!(portal.hidden_menu_pages || []).includes(key)));
          if (!user || user.role !== 'admin') $('a[data-page="./pages/portal-settings.html"], a[data-page="./pages/gb28181-settings.html"]').parent().hide();
          const links = (portal.quick_links || []).map(item => `<li class="layui-nav-item"><a href="${$('<div>').text(item.url).html()}" target="_blank" rel="noopener noreferrer">${$('<div>').text(item.label).html()}</a></li>`).join('');
          $('#portal-quick-links').html(links);
          element.render('nav');
          const watermark = $('#platform-watermark').empty();
          if (!security.watermark_enabled) return;
          const pieces = [security.watermark_text || '内部资料'];
          if (security.watermark_show_username && user) pieces.push(user.username);
          if (security.watermark_show_ip) pieces.push(window.location.hostname);
          const text = pieces.filter(Boolean).join('  ');
          for (let top = 20; top < window.innerHeight + 120; top += 150) for (let left = -40; left < window.innerWidth + 200; left += 260) watermark.append($('<span>').text(text).css({ top, left }));
          watermark.show();
        }

        function openPasswordChange(forceChange) {
          layer.open({ type: 1, title: forceChange ? "请先修改初始密码" : "修改密码", area: ["480px", "auto"], closeBtn: forceChange ? 0 : 1, content: '<form class="layui-form" style="padding:18px"><div class="layui-form-item"><label class="layui-form-label">当前密码</label><div class="layui-input-block"><input id="ID_current_password" type="password" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">新密码</label><div class="layui-input-block"><input id="ID_new_password" type="password" class="layui-input" placeholder="至少 8 位"></div></div><div class="layui-form-item"><div class="layui-input-block"><button type="button" id="ID_save_password" class="layui-btn">保存</button></div></div></form>', success: function (layerElement, index) { $("#ID_save_password").on("click", function () { $.ajax({ url: "/api/auth/password", type: "POST", contentType: "application/json", data: JSON.stringify({ current_password: $("#ID_current_password").val(), new_password: $("#ID_new_password").val() }), success: function (res) { if (res.code === 0) { layer.close(index); layer.msg("密码已修改"); } else layer.msg(res.msg || "修改失败"); }, error: function (xhr) { layer.msg((xhr.responseJSON && xhr.responseJSON.msg) || "请求失败"); } }); }); } });
        }

        $.get("/api/auth/me").done(function (res) {
          if (!res || res.code !== 0 || !res.data) {
            window.location.replace(`login.html?return_to=${encodeURIComponent(window.location.pathname + window.location.search)}`);
            return;
          }
          document.body.classList.add('is-authenticated');
          renderUserNav(res.data);
          $.get('/api/platform-settings').done(settings => { if (settings.code === 0) applyPlatformSettings(settings.data || {}, res.data); });
          if (res.data.must_change_password) openPasswordChange(true);
        }).fail(function () { window.location.replace(`login.html?return_to=${encodeURIComponent(window.location.pathname + window.location.search)}`); });

        $("body").on("click", "#ID_change_password", function () { openPasswordChange(false); });

        $("body").on("click", "#ID_logout", function () {
          layer.confirm("确定退出当前登录吗？", { title: "退出登录" }, function (index) {
            $.post("/api/auth/logout").always(function () {
              layer.close(index);
              window.location.href = "login.html";
            });
          });
        });

        // 复制函数
        window.copyToClipboard = function (text) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          textarea.style.top = "-9999px";
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand("copy");
            layer.msg("✅ 已复制", { time: 500 });
          } catch (err) {
            layer.msg("❌ 复制失败", { time: 1000 });
          }
          document.body.removeChild(textarea);
        };

        // 子页面加载函数
        function loadPage(url) {
          window.streamUiPageUrl = url;
          $(".layui-body").html(
            '<div style="text-align:center;padding:20px;">加载中...</div>'
          );

          return $.ajax({ url: url, cache: false })
            .done(function (data) {
              // 离开页面前执行回调函数
              if (typeof destroyVideoCells === "function") {
                destroyVideoCells();
              }
              if (typeof clearnTimer === "function") {
                clearnTimer();
              }

              $(".layui-body").html(data);

              // 找到匹配 data-page 的菜单项并添加高亮
              $(".layui-nav-tree .layui-this").removeClass("layui-this");
              $('.layui-nav-tree a[data-page="' + url + '"]')
                .parent()
                .addClass("layui-this");
            })
            .fail(function () {
              $(".layui-body").html(
                `<div style="color:#ff5722; padding:20px;">加载失败: 页面 ${url} 不存在</div>`
              );
            });

        }

        // 使用事件委托监听菜单点击
        $("body").on("click", "a[data-page]", function (e) {
          e.preventDefault();
          loadPage($(this).data("page"));
        });

        let isCollapse = false;
        util.event('lay-header-event', {
          toggleSidebar: function (othis) {

            const icon = othis.find('i');
            const $logo = $('.layui-logo');
            const $logoText = $logo.find('.logo-text');
            const $logoIcon = $logo.find('.logo-icon');
            const $logoMark = $logo.find('.logo-mark');

            if (!isCollapse) {
              // 收缩状态
              $('.layui-layout-admin .layui-header .layui-logo').animate({ width: '54px' }, 200);
              $('#header-tools').animate({ left: '54px' }, 200);
              $('.layui-layout-admin .layui-side').animate({ width: '54px' }, 200);
              $('.layui-layout-admin .layui-body').animate({ left: '54px' }, 200);

              $logoText.hide();
              $logoMark.hide();
              $logoIcon.show();

              icon.removeClass('layui-icon-shrink-right').addClass('layui-icon-spread-left');

              isCollapse = true;

            } else {
              // 展开状态
              $('.layui-layout-admin .layui-header .layui-logo').animate({ width: '200px' }, 200);
              $('#header-tools').animate({ left: '200px' }, 200);
              $('.layui-layout-admin .layui-side').animate({ width: '200px' }, 200);
              $('.layui-layout-admin .layui-body').animate({ left: '200px' }, 200);

              $logoText.show();
              $logoMark.show();
              $logoIcon.hide();

              icon.removeClass('layui-icon-spread-left').addClass('layui-icon-shrink-right');

              isCollapse = false;

            }
          },
          refreshPage: function () {
            const $icon = $(this).find(".layui-icon");
            const currentUrl = $('.layui-nav-tree li.layui-this a[data-page]').data('page');

            if (!currentUrl) { return }

            $icon
              .removeClass("layui-icon-refresh")
              .addClass("layui-icon-loading layui-anim layui-anim-rotate");

            loadPage(currentUrl).always(() => {
              $icon
                .removeClass("layui-icon-loading layui-anim layui-anim-rotate")
                .addClass("layui-icon-refresh");
            });
          }
        });

        const initialPage = new URLSearchParams(window.location.search).get("page");
        loadPage(initialPage === "cases" ? "./pages/cases.html" : "./pages/home.html");
      });
    </script>
</body>

</html>
